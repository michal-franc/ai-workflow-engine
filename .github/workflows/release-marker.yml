name: Release Marker

on:
  # Agents merge into the local main and add their changes under
  # `## Unreleased`; the lead pushes main when the owner asks. A push releases
  # only when the CHANGELOG's top heading is a version the lead has just cut
  # (`## vX.Y.Z — date`).
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to generate release notes for (e.g. v0.2.0). Leave empty to use the latest tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-marker:
    # A private repo is a dev repo (privacy.code: snapshots): it builds no
    # releases; the public repo gets one snapshot commit per release.
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              CURRENT="$INPUT_TAG"
            else
              CURRENT="$(git describe --tags --abbrev=0)"
            fi
            TARGET_SHA="$(git rev-parse HEAD)"
          else
            CHANGELOG="cmd/issue-cli/CHANGELOG.md"
            TOP="$(grep -m1 -E '^## ' "$CHANGELOG" | awk '{print $2}')"
            if ! printf '%s' "$TOP" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Top CHANGELOG heading is '${TOP:-<none>}', not a version — nothing to release." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CURRENT="$TOP"
            if [ -z "$CURRENT" ]; then
              echo "No '## vX.Y.Z' entry found in $CHANGELOG — skipping release." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git rev-parse -q --verify "refs/tags/$CURRENT" >/dev/null; then
              echo "Tag $CURRENT already exists — skipping." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TARGET_SHA="$PUSH_SHA"
          fi

          PREV="$(git describe --tags --abbrev=0 "${TARGET_SHA}^" 2>/dev/null || true)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Current:  $CURRENT"
          echo "Previous: ${PREV:-<none>}"
          echo "Target:   $TARGET_SHA"

      - name: Create and push tag
        if: ${{ steps.version.outputs.skip != 'true' && github.event_name == 'push' }}
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$CURRENT" "$TARGET_SHA" -m "$CURRENT"
          git push origin "refs/tags/$CURRENT"

      - name: Release notes from the CHANGELOG
        if: ${{ steps.version.outputs.skip != 'true' }}
        id: notes
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        run: |
          set -euo pipefail

          # The notes are the CHANGELOG's "## <version> — <date>" section: a
          # release snapshot is one commit, so commit subjects say nothing.
          CHANGELOG="cmd/issue-cli/CHANGELOG.md"
          TMP="$(mktemp -d)"
          # Read the whole file first: an awk that stops early in a pipe makes
          # git show die of SIGPIPE, which pipefail turns into a failed step
          # (exit 141, v0.54.0).
          git show "${TARGET_SHA}:${CHANGELOG}" > "$TMP/changelog.md"
          awk -v v="$CURRENT" '
            /^## / { if (found) done = 1; else if ($2 == v) { found = 1; next } }
            found && !done { print }
          ' "$TMP/changelog.md" | sed -e '/./,$!d' > "$TMP/notes.md"
          if [ ! -s "$TMP/notes.md" ]; then
            echo "_No ${CURRENT} section in ${CHANGELOG}._" > "$TMP/notes.md"
          fi

          echo "---- release notes ----"
          cat "$TMP/notes.md"
          echo "-----------------------"

          echo "path=$TMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.version.outputs.current }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$CURRENT" >/dev/null 2>&1; then
            gh release edit "$CURRENT" --notes-file "$NOTES_PATH"
          else
            gh release create "$CURRENT" --title "$CURRENT" --notes-file "$NOTES_PATH"
          fi

  build-binaries:
    needs: release-marker
    if: ${{ needs.release-marker.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: refs/tags/${{ needs.release-marker.outputs.current }}

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.release-marker.outputs.current }}
        run: |
          set -euo pipefail
          STAGE="dist/issue-viewer_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "$STAGE"
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o "$STAGE/issue-viewer" .
          go build -trimpath -ldflags "$LDFLAGS" -o "$STAGE/issue-cli" ./cmd/issue-cli
          cp README.md "$STAGE/"

      - name: Package archive
        id: pkg
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.release-marker.outputs.current }}
        run: |
          set -euo pipefail
          NAME="issue-viewer_${VERSION}_${GOOS}_${GOARCH}"
          cd dist
          tar -czf "${NAME}.tar.gz" "$NAME"
          ARCHIVE="${NAME}.tar.gz"
          # `sha256sum` output format: "<hash>  <filename>" — exactly what
          # `sha256sum -c` expects, so the install script can verify with a
          # one-liner.
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "asset=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ needs.release-marker.outputs.current }}
          ASSET: ${{ steps.pkg.outputs.asset }}
          CHECKSUM: ${{ steps.pkg.outputs.checksum }}
        run: |
          set -euo pipefail
          gh release upload "$CURRENT" "$ASSET" "$CHECKSUM" --clobber
