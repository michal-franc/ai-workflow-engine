name: Release Marker

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to generate release notes for (e.g. v0.2.0). Leave empty to use the latest tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-marker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.version.outputs.current }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              CURRENT="$INPUT_TAG"
            else
              CURRENT="$(git describe --tags --abbrev=0)"
            fi
            TARGET_SHA="$(git rev-parse HEAD)"
          else
            CHANGELOG="cmd/issue-cli/CHANGELOG.md"
            CURRENT="$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+' "$CHANGELOG" | awk '{print $2}')"
            if [ -z "$CURRENT" ]; then
              echo "No '## vX.Y.Z' entry found in $CHANGELOG — skipping release." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git rev-parse -q --verify "refs/tags/$CURRENT" >/dev/null; then
              echo "Tag $CURRENT already exists — skipping." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TARGET_SHA="$MERGE_SHA"
          fi

          PREV="$(git describe --tags --abbrev=0 "${TARGET_SHA}^" 2>/dev/null || true)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Current:  $CURRENT"
          echo "Previous: ${PREV:-<none>}"
          echo "Target:   $TARGET_SHA"

      - name: Create and push tag
        if: ${{ steps.version.outputs.skip != 'true' && github.event_name == 'pull_request' }}
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$CURRENT" "$TARGET_SHA" -m "$CURRENT"
          git push origin "refs/tags/$CURRENT"

      - name: Generate categorized release notes
        if: ${{ steps.version.outputs.skip != 'true' }}
        id: notes
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS" ]; then
            RANGE="${PREVIOUS}..${TARGET_SHA}"
          else
            RANGE="$TARGET_SHA"
          fi

          categorize() {
            local sha="$1"
            local files
            files="$(git show --no-renames --name-only --pretty=format: "$sha" | sed '/^$/d')"
            local cat_cli=0 cat_ui=0 cat_wf=0 cat_other=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                cmd/issue-cli/*)                cat_cli=1 ;;
                templates/*|static/*)           cat_ui=1 ;;
                handlers.go|handlers_test.go|docs.go|main.go) cat_ui=1 ;;
                workflow.yaml|workflow.yaml.example) cat_wf=1 ;;
                internal/tracker/workflow*)     cat_wf=1 ;;
                internal/tracker/*)             cat_other=1 ;;
                *)                              cat_other=1 ;;
              esac
            done <<< "$files"
            [ $cat_cli   -eq 1 ] && echo "CLI"
            [ $cat_ui    -eq 1 ] && echo "UI"
            [ $cat_wf    -eq 1 ] && echo "Workflow"
            [ $cat_other -eq 1 ] && echo "Other"
          }

          TMP="$(mktemp -d)"
          : > "$TMP/CLI"
          : > "$TMP/UI"
          : > "$TMP/Workflow"
          : > "$TMP/Other"

          for sha in $(git rev-list --reverse "$RANGE"); do
            subject="$(git log -1 --pretty=%s "$sha")"
            short="$(git rev-parse --short "$sha")"
            line="- ${subject} (${short})"
            for cat in $(categorize "$sha" | sort -u); do
              echo "$line" >> "$TMP/$cat"
            done
          done

          {
            echo "## Release ${CURRENT}"
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "_Changes since ${PREVIOUS}._"
            else
              echo "_Initial tagged release._"
            fi
            echo
            for cat in UI CLI Workflow Other; do
              if [ -s "$TMP/$cat" ]; then
                echo "### ${cat}"
                cat "$TMP/$cat"
                echo
              fi
            done
          } > "$TMP/notes.md"

          echo "---- release notes ----"
          cat "$TMP/notes.md"
          echo "-----------------------"

          echo "path=$TMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.version.outputs.current }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$CURRENT" >/dev/null 2>&1; then
            gh release edit "$CURRENT" --notes-file "$NOTES_PATH"
          else
            gh release create "$CURRENT" --title "$CURRENT" --notes-file "$NOTES_PATH"
          fi

  build-binaries:
    needs: release-marker
    if: ${{ needs.release-marker.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: refs/tags/${{ needs.release-marker.outputs.current }}

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.release-marker.outputs.current }}
        run: |
          set -euo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          STAGE="dist/issue-viewer_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "$STAGE"
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o "$STAGE/issue-viewer${EXT}" .
          go build -trimpath -ldflags "$LDFLAGS" -o "$STAGE/issue-cli${EXT}" ./cmd/issue-cli
          cp README.md "$STAGE/"

      - name: Package archive
        id: pkg
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.release-marker.outputs.current }}
        run: |
          set -euo pipefail
          NAME="issue-viewer_${VERSION}_${GOOS}_${GOARCH}"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -r "${NAME}.zip" "$NAME"
            echo "asset=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${NAME}.tar.gz" "$NAME"
            echo "asset=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ needs.release-marker.outputs.current }}
          ASSET: ${{ steps.pkg.outputs.asset }}
        run: |
          set -euo pipefail
          gh release upload "$CURRENT" "$ASSET" --clobber
