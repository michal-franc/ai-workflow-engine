# Workflow feature catalog: every workflow.yaml capability the engine supports.
#
# Read by:
#   issue-cli workflow scan     detects which entries a workflow.yaml has and
#                               writes its `features:` record
#   issue-cli workflow upgrade  proposes entries a project lacks (propose: true
#                               only, unless --all), item by item, read-only
#
# Kept separate from CHANGELOG.md (engine release notes). Installing a feature
# means an agent copies its snippet, adapted, into workflow.yaml; nothing here
# is merged at load time. When the engine gains a capability, or a change
# alters what a project adopts:
#   1. add or update the entry here with `version:` = the next release (the
#      one after the newest `## vX.Y.Z` in CHANGELOG.md),
#   2. bump that template's `template: <name>@<version>` stamp if the template
#      file itself changed, and re-run `issue-cli workflow scan` on it so its
#      `features:` record matches.
# make validate enforces both: TestEveryWorkflowFeatureHasACatalogEntry fails
# on a workflow.yaml key, validator rule or action type no entry covers, and
# `issue-cli workflow catalog-check` fails on a branch that changes an entry's
# sources: or a template without the bump (or a `Catalog: n/a <id> <why>`
# commit trailer). TestWorkflowFeature* checks fields, probe paths, stamps,
# records and snippets.
#
# Fields:
#   id           stable kebab-case name; recorded as <id>@<version>
#   version      issue-cli release that last changed the entry
#   category     grouping for output: lifecycle, gates, automation, actions,
#                board, workbench, dispatch, conventions
#   propose      true: `upgrade` proposes it to projects that lack it;
#                false: catalog only (scanned and recorded; listed by upgrade --all)
#   templates    bundled templates `upgrade` proposes it for (empty = all)
#   requires     entry ids the project must have first; upgrade proposes the
#                entry only then (--all lists it with `needs`)
#   sources      repo globs of the code behind the feature (`**` allowed,
#                anchored at the repo root), or `file.go#Symbol` for one Go
#                declaration; "@prompt" for prompt-only conventions. Changing
#                them on a branch needs a version bump (catalog-check)
#   title, what, why, where, question   shown to the agent
#   snippet      YAML example (must parse); adapt status names to the project
#   detect       structural probes over the parsed workflow.yaml; the feature is
#                present when ANY probe matches. Each probe has a `path` and at
#                most one condition:
#                  (none)    the value is set: not empty, false, 0 or null
#                  equals    the value equals this scalar
#                  one_of    the value is one of these strings
#                  rule_in   the rule name (text before ':') is one of these
#                  contains  the string value contains this text (case-insensitive)
#                Path syntax: `key`, `key[]` (each list item), `*` (each map
#                value). A path starting with statuses[] or transitions[] also
#                matches inside every types.<t> and systems.<s> overlay.

entries:
  # ---------------------------------------------------------------- lifecycle
  - id: status-prompts
    version: v0.36.0
    category: lifecycle
    propose: false
    sources: ["internal/tracker/workflow_config.go#WorkflowStatus", "internal/tracker/dispatch_prompt.go"]
    title: "Per-status agent guidance"
    what: |
      `statuses[].prompt` is shown to the agent when an issue enters that status
      (start, transition, dispatch briefing).
    why: |
      Tells the agent what "done" means at each step without repeating it in every
      dispatch prompt.
    where: "statuses[].prompt"
    snippet: |
      statuses:
        - name: "in progress"
          description: "Being implemented"
          prompt: |
            Implement the approved design. Keep the Implementation checklist current.
    question: "Which statuses need written guidance for the agent, and what should it say?"
    detect:
      - path: statuses[].prompt

  - id: optional-statuses
    version: v0.36.0
    category: lifecycle
    propose: false
    sources: ["internal/tracker/workflow_transition.go#DefaultNextStatus", "internal/tracker/workflow_transition.go#IsSideStatus", "handlers_detail.go"]
    title: "Optional (skippable) statuses"
    what: |
      `optional: true` lets a forward transition skip the status. The viewer shows a
      CTA button (label set by the edge's `cta_label`) to divert into it.
    why: |
      Steps like human testing that only some issues need stay in the lifecycle
      without forcing every issue through them.
    where: "statuses[].optional, plus transitions[].cta_label on the edge into it"
    snippet: |
      statuses:
        - name: "human-testing"
          description: "Waiting on manual verification"
          optional: true
      transitions:
        - from: "testing"
          to: "human-testing"
          cta_label: "Needs human testing"
          actions:
            - type: "require_human_approval"
              status: "human-testing"
    question: "Is there a step only some issues need (e.g. human testing)? Should it be skippable?"
    detect:
      - path: statuses[].optional
        equals: true
      - path: transitions[].cta_label

  - id: parked-status
    version: v0.36.0
    category: lifecycle
    propose: true
    templates: [development]
    sources: ["internal/tracker/workflow_transition.go#IsValidTransition", "internal/tracker/workflow_types.go"]
    title: "Parked statuses (blocked / deferred)"
    what: |
      A status marked `optional: true` and `global: true`, reachable from anywhere with a
      `from: "*"` transition that collects a reason via declarative `fields:`. Issues can
      leave it to any status.
    why: |
      Gives blocked or deferred work a visible column with a recorded reason, without
      enumerating edges from every status.
    where: "a new entry in statuses: (and board.columns), plus a from: \"*\" transition"
    snippet: |
      statuses:
        - name: "deferred"
          description: "Parked — captured for later"
          optional: true
          global: true
      transitions:
        - from: "*"
          to: "deferred"
          fields:
            - name: "deferral_reason"
              prompt: "Reason for deferral"
              target: "section:Deferred Record"
              type: "multiline"
              required: true
    question: "Do you want a parked status for blocked or deferred work? What should it be called, and should it ask for a reason?"
    detect:
      - path: statuses[].global
        equals: true

  - id: wildcard-transitions
    version: v0.36.0
    category: lifecycle
    propose: false
    sources: ["internal/tracker/workflow_transition.go#IsValidTransition", "internal/tracker/workflow_transition.go#transitionActions"]
    title: "Wildcard transitions (from: \"*\")"
    what: |
      A transition with `from: "*"` applies from any status that has no exact edge to
      the target.
    why: |
      One edge instead of one per source status, e.g. "anything can be parked".
    where: "transitions[] with from: \"*\""
    snippet: |
      transitions:
        - from: "*"
          to: "blocked"
          actions:
            - type: "inject_prompt"
              prompt: "Record what blocks the issue in a comment."
    question: "Is there a status every issue should be able to reach from anywhere?"
    detect:
      - path: transitions[].from
        equals: "*"

  - id: transition-fields
    version: v0.36.0
    category: lifecycle
    propose: false
    sources: ["internal/tracker/workflow_config.go#WorkflowField", "internal/tracker/workflow_transition.go#TransitionFields", "internal/tracker/workflow_transition.go#ValidateFieldAnswers", "internal/tracker/workflow_transition.go#MergeFieldValuesFromFrontmatter"]
    title: "Transition fields (answers collected before a move)"
    what: |
      `transitions[].fields` asks the human (in the viewer) or the agent (`--field`) for
      values before the transition commits, written to frontmatter or a body section.
    why: |
      Captures the reason or decision at the moment of the move, in a fixed place.
    where: "transitions[].fields"
    snippet: |
      transitions:
        - from: "in progress"
          to: "done"
          fields:
            - name: "resolution"
              prompt: "How was this resolved?"
              required: true
    question: "Should any transition ask for a value (a reason, a link, a decision) before it goes through?"
    detect:
      - path: transitions[].fields[].name

  - id: types-of-work
    version: v0.36.0
    category: lifecycle
    propose: true
    templates: [development]
    sources: ["internal/tracker/workflow_types.go", "cmd/issue-cli/cmd_set_type.go"]
    title: "Types of work: lighter paths for tweaks and bugfixes"
    what: |
      `default_type` plus a `types:` block. An issue's `type:` frontmatter picks its path
      through the statuses: `feature` walks every status, `tweak` skips design and
      docs, `bugfix` needs a Repro section and a failing test first. Set with
      `issue-cli create --type` or `issue-cli set-type`. See docs/Workflow/types.md.
    why: |
      Without types every five-minute tweak walks the full design path. Types give
      each kind of work its own gates and prompts, enforced by the engine instead of
      prompt text every agent has to read.
    where: "new top-level default_type: and types: keys; path entries must be names from your statuses: list"
    snippet: |
      default_type: feature
      types:
        feature:
          description: "New behaviour: the full path"
        tweak:
          description: "A small change the human already decided; no design"
          path: [idea, in progress, testing, shipping, done]
          transitions:
            - from: "idea"
              to: "in progress"
              actions:
                - type: "require_human_approval"
                  status: "in progress"
                - type: "validate"
                  rule: "has_assignee"
            - from: "testing"
              to: "shipping"
              actions:
                - type: "validate"
                  rule: "section_checkboxes_checked: Testing"
                - type: "require_human_approval"
                  status: "shipping"
                - type: "append_section"
                  title: "Shipping"
                  body: |
                    - [ ] Changes committed with a message referencing the issue
        bugfix:
          description: "Something that worked is broken: a repro and a failing test first"
          path: [idea, in progress, testing, human-testing, documentation, shipping, done]
          transitions:
            - from: "idea"
              to: "in progress"
              actions:
                - type: "validate"
                  rule: "has_section"
                  section: "Repro"
                - type: "require_human_approval"
                  status: "in progress"
    question: "Do you want separate paths for kinds of work (e.g. tweak skips design, bugfix needs a repro first)? Which types, and which statuses should each skip?"
    detect:
      - path: types

  - id: system-overlays
    version: v0.36.0
    category: lifecycle
    propose: true
    sources: ["internal/tracker/workflow_merge.go"]
    title: "Per-system prompt and checklist overlays"
    what: |
      `systems:` overrides status prompts and appends transition actions for issues whose
      `system:` frontmatter matches, e.g. telling API issues to update docs/API/ in the
      documentation step.
    why: |
      Area-specific instructions reach only the issues they apply to instead of
      bloating every prompt.
    where: "new top-level systems: map keyed by system name"
    snippet: |
      systems:
        API:
          statuses:
            - name: "documentation"
              prompt: |
                Update docs/API/ with any changed endpoints, request/response formats, or behavior.
          transitions: []
    question: "Are there areas of the project (systems) that need their own instructions or checklists? Which ones, and what differs?"
    detect:
      - path: systems

  # -------------------------------------------------------------------- gates
  - id: human-approval-gates
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/gate.go", "internal/tracker/approval_comment.go", "internal/tracker/workflow_transition.go#ApprovalMissingError"]
    title: "Human approval gates"
    what: |
      A `require_human_approval` action blocks a transition until the human approves the
      target status in the viewer (or `issue-cli approve`).
    why: |
      The human decides when design is settled or work can ship; the agent can't
      skip ahead.
    where: "transitions[].actions[] type: require_human_approval"
    snippet: |
      transitions:
        - from: "in design"
          to: "backlog"
          actions:
            - type: "require_human_approval"
              status: "backlog"
    question: "Which transitions should wait for your approval?"
    detect:
      - path: transitions[].actions[].type
        one_of: [require_human_approval]
      - path: transitions[].actions[].rule
        rule_in: [approved_for, human_approval]

  - id: checklist-gates
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/workflow_validate.go#checkRule", "internal/tracker/workflow_validate.go#openCheckboxesError", "internal/tracker/checkbox_ref.go"]
    title: "Checklist gates"
    what: |
      Validators that block a transition until checkboxes exist or are ticked:
      `section_checkboxes_checked: <Title>`, `section_has_checkboxes: <Title>`,
      `all_checkboxes_checked`, `has_checkboxes`.
    why: |
      Turns each step's checklist into something the engine enforces.
    where: "transitions[].actions[] type: validate, rule: section_checkboxes_checked: <Title> (etc.)"
    snippet: |
      transitions:
        - from: "in progress"
          to: "testing"
          actions:
            - type: "validate"
              rule: "section_checkboxes_checked: Implementation"
    question: "Should a step's checklist be fully ticked before the issue can move on?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [section_checkboxes_checked, section_has_checkboxes, all_checkboxes_checked, has_checkboxes]

  - id: assignee-gate
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/workflow_validate.go#checkRule"]
    title: "Assignee required to start"
    what: |
      The `has_assignee` validator blocks a transition until someone has claimed the
      issue (`issue-cli start` sets the assignee).
    why: |
      Two agents never pick up the same issue unknowingly.
    where: "transitions[].actions[] rule: has_assignee"
    snippet: |
      transitions:
        - from: "backlog"
          to: "in progress"
          actions:
            - type: "validate"
              rule: "has_assignee"
    question: "Should work only start once the issue is claimed?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [has_assignee]

  - id: test-plan-gate
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/workflow_validate.go#checkRule"]
    title: "Test plan required"
    what: |
      The `has_test_plan` validator requires a `## Test Plan` section with `### Automated`
      and `### Manual` subsections.
    why: |
      Testing is planned before it is claimed done.
    where: "transitions[].actions[] rule: has_test_plan"
    snippet: |
      transitions:
        - from: "in progress"
          to: "testing"
          actions:
            - type: "validate"
              rule: "has_test_plan"
    question: "Should an issue need a written test plan before testing?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [has_test_plan]

  - id: comment-evidence-gates
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/workflow_validate.go#checkRule"]
    title: "Evidence comments required (tests:, docs:)"
    what: |
      `has_comment_prefix: <prefix>` blocks a transition until a comment starting with
      the prefix exists, e.g. `tests:` with the test results.
    why: |
      The agent leaves a record of what it ran or wrote, not just a ticked box.
    where: "transitions[].actions[] rule: has_comment_prefix: <prefix>"
    snippet: |
      transitions:
        - from: "testing"
          to: "documentation"
          actions:
            - type: "validate"
              rule: "has_comment_prefix: tests:"
    question: "Which steps should leave an evidence comment (test results, docs changed)?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [has_comment_prefix]

  - id: body-structure-gates
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/validations/has_section.go", "internal/tracker/validations/section_min_length.go", "internal/tracker/validations/section_max_length.go"]
    title: "Body and section content gates"
    what: |
      `body_not_empty`, `has_section` (a `## <section>` exists), `section_min_length` and
      `section_max_length` check the issue body's shape.
    why: |
      E.g. a bugfix can't start without a Repro section; a summary stays short.
    where: "transitions[].actions[] rule: has_section (with section:), section_min_length (min:), …"
    snippet: |
      transitions:
        - from: "idea"
          to: "in progress"
          actions:
            - type: "validate"
              rule: "has_section"
              section: "Repro"
    question: "Should any step require a section (or a minimum amount of text) in the issue body?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [body_not_empty, has_section, section_min_length, section_max_length]

  - id: todo-marker-gate
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/validations/no_todo_markers.go"]
    title: "No TODO/FIXME markers"
    what: |
      `no_todo_markers` blocks a transition while the issue body contains a whole-word
      TODO or FIXME.
    why: |
      Placeholders left in a design or plan get resolved before the work moves on.
    where: "transitions[].actions[] rule: no_todo_markers"
    snippet: |
      transitions:
        - from: "in design"
          to: "backlog"
          actions:
            - type: "validate"
              rule: "no_todo_markers"
    question: "Should open TODO/FIXME markers in the issue block a step?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [no_todo_markers]

  - id: frontmatter-gates
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/validations/field_present.go", "internal/tracker/validations/field_not_empty.go", "internal/tracker/validations/field_in.go", "internal/tracker/validations/field_matches.go"]
    title: "Frontmatter field gates"
    what: |
      `field_present`, `field_not_empty`, `field_in` (with `values:`) and `field_matches`
      (with `pattern:`) check a frontmatter key named by `field:`.
    why: |
      E.g. an issue needs a `version` or a valid `priority` before it is scheduled.
    where: "transitions[].actions[] rule: field_not_empty (field:), field_in (field:, values:), …"
    snippet: |
      transitions:
        - from: "backlog"
          to: "in progress"
          actions:
            - type: "validate"
              rule: "field_in"
              field: "priority"
              values: [low, medium, high, critical]
    question: "Should any frontmatter field be required or restricted before a step?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [field_present, field_not_empty, field_in, field_matches]

  - id: label-gates
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/validations/has_label.go", "internal/tracker/validations/has_any_label.go"]
    title: "Label gates"
    what: |
      `has_label` (label named by `field:`) and `has_any_label` check the issue's labels.
    why: |
      E.g. an issue must be labelled before it leaves triage.
    where: "transitions[].actions[] rule: has_label (field:) or has_any_label"
    snippet: |
      transitions:
        - from: "idea"
          to: "backlog"
          actions:
            - type: "validate"
              rule: "has_any_label"
    question: "Should issues need a label before some step?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [has_label, has_any_label]

  - id: pr-url-gate
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/validations/has_pr_url.go"]
    title: "Pull request link required"
    what: |
      `has_pr_url` requires the frontmatter `pr:` to be a GitHub pull request URL.
    why: |
      Shipping can't be claimed without the PR that ships it.
    where: "transitions[].actions[] rule: has_pr_url"
    snippet: |
      transitions:
        - from: "shipping"
          to: "done"
          actions:
            - type: "validate"
              rule: "has_pr_url"
    question: "Should an issue need a linked PR before it is done?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [has_pr_url]

  - id: linked-issue-gate
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/validations/linked_issue_in_status.go"]
    title: "Linked issue status gate"
    what: |
      `linked_issue_in_status` requires the issue named in a frontmatter key (`ref_key:`)
      to be in `linked_status:`, e.g. a child waits for its parent.
    why: |
      Enforces ordering between issues (epics, dependencies) in the engine.
    where: "transitions[].actions[] rule: linked_issue_in_status (ref_key:, linked_status:)"
    snippet: |
      transitions:
        - from: "shipping"
          to: "done"
          actions:
            - type: "validate"
              rule: "linked_issue_in_status"
              ref_key: "parent"
              linked_status: "done"
    question: "Do some issues depend on others? Should a step wait for the linked issue?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [linked_issue_in_status]

  - id: shell-gate
    version: v0.36.0
    category: gates
    propose: true
    templates: [development]
    sources: ["internal/tracker/validations/command_succeeds.go"]
    title: "Shell command gates (command_succeeds)"
    what: |
      `allow_shell: true` enables the `command_succeeds` validator, so a transition can
      require a command (e.g. the test suite) to exit 0.
    why: |
      Turns "tests pass" from a checkbox the agent ticks into something the engine
      checks.
    where: "new top-level allow_shell: true, plus a validate action on the gated transition"
    snippet: |
      allow_shell: true
      transitions:
        - from: "in progress"
          to: "testing"
          actions:
            - type: "validate"
              rule: "command_succeeds"
              command: "cd .. && make test"   # runs in the issues directory
              timeout_seconds: 300
              hint: "make the test suite pass before moving to testing"
    question: "Should any transition require a command to pass (e.g. tests before testing)? Which command, on which transition?"
    detect:
      - path: allow_shell
        equals: true
      - path: transitions[].actions[].rule
        rule_in: [command_succeeds]

  - id: failure-hints
    version: v0.36.0
    category: gates
    propose: false
    sources: ["internal/tracker/validations/helpers.go"]
    title: "Custom failure hints"
    what: |
      `hint:` on a validate action replaces the default failure message with the exact
      fix, templated with {{slug}}/{{number}}/{{repo}}/{{system}}.
    why: |
      A blocked agent gets the command that unblocks it instead of guessing.
    where: "transitions[].actions[].hint"
    snippet: |
      transitions:
        - from: "idea"
          to: "in progress"
          actions:
            - type: "validate"
              rule: "has_section"
              section: "Repro"
              hint: "issue-cli append {{slug}} --body \"## Repro\\n<steps>\""
    question: "Are there gates agents keep tripping on where a specific fix message would help?"
    detect:
      - path: transitions[].actions[].hint

  - id: proof-links
    version: v0.54.0
    category: gates
    propose: true
    templates: [development]
    sources: ["internal/proof/**", "internal/tracker/proof.go", "cmd/issue-cli/cmd_prove.go"]
    title: "Each acceptance criterion linked to its proof"
    what: |
      Acceptance criteria must be checkboxes with their own text (criteria_checkboxes at
      the design gate), and before human-testing every criterion needs a proof link that
      passes its check (criteria_proven). Agents declare links where they write the proof:
      `proves: [AC2]` on a playtest step, a `Proves: AC2 <TestName>` or `Proves: AC2`
      trailer on a commit; `issue-cli prove` is the fallback and records measured values.
      The engine checks every link (the test exists and a tests: comment is newer than the
      code, the step passed, the commit is on the branch) and ticks the proven boxes.
      The shipping prompt asks for `risk:` comments on anything to watch after the ship.
    why: |
      Nothing said which test, step or commit proves which criterion, so criteria were
      ticked on the agent's word (or only the template placeholder was). The links make
      "is it proven?" a question the engine answers, and give the Evidence tab its matrix.
    where: "the in design → backlog / in progress validations, the testing → human-testing validations, and the \"in progress\" and \"shipping\" status prompts"
    snippet: |
      transitions:
        - from: "in design"
          to: "backlog"
          actions:
            - type: "validate"
              rule: "criteria_checkboxes: Acceptance Criteria"
        - from: "testing"
          to: "human-testing"
          actions:
            - type: "validate"
              rule: "criteria_proven: since {{today}}"   # issues created before this date don't need proof
      statuses:
        - name: "in progress"
          prompt: |
            Declare each acceptance criterion's proof where you write it: `proves: [AC2]` on the playtest step that shows it, a `Proves: AC2 <TestName>` trailer on the commit that adds or changes the test, or `Proves: AC2` on the commit that is the change. `issue-cli prove <slug> --list` shows what is proven.
        - name: "shipping"
          prompt: |
            Before closing, post a `risk:` comment (`issue-cli comment <slug> --text "risk: ..."`) for anything to watch after the ship, or "risk: none".
    question: "Should every acceptance criterion be linked to a proof the engine checks before human-testing (from today; older issues are exempt)?"
    detect:
      - path: transitions[].actions[].rule
        rule_in: [criteria_proven, criteria_checkboxes]

  # --------------------------------------------------------------- automation
  - id: checklist-sections
    version: v0.36.0
    category: automation
    propose: false
    sources: ["internal/tracker/workflow_transition.go#ApplyTransitionWithFields", "internal/tracker/heading.go"]
    title: "Checklist sections appended on transition"
    what: |
      An `append_section` action adds a `## <title>` section (usually checkboxes) to the
      issue body when it enters a status.
    why: |
      Each step brings its own checklist; the agent works through it and checks boxes
      by id.
    where: "transitions[].actions[] type: append_section (title:, body:)"
    snippet: |
      transitions:
        - from: "backlog"
          to: "in progress"
          actions:
            - type: "append_section"
              title: "Implementation"
              body: |
                - [ ] Code changes complete
                - [ ] Automated tests added or updated
    question: "What checklist should each step add to the issue?"
    detect:
      - path: transitions[].actions[].type
        one_of: [append_section]

  - id: transition-prompts
    version: v0.36.0
    category: automation
    propose: false
    sources: ["internal/tracker/workflow_transition.go#ApplyTransitionWithFields"]
    title: "Prompts injected on a transition"
    what: |
      An `inject_prompt` action adds guidance for the agent on that specific edge, on top
      of the target status prompt.
    why: |
      Edge-specific instructions (what to do when entering testing from in progress)
      without changing the status prompt for every way in.
    where: "transitions[].actions[] type: inject_prompt (prompt:)"
    snippet: |
      transitions:
        - from: "in progress"
          to: "testing"
          actions:
            - type: "inject_prompt"
              prompt: "Run the relevant tests and record the results as a tests: comment."
    question: "Does any transition need its own instruction for the agent?"
    detect:
      - path: transitions[].actions[].type
        one_of: [inject_prompt]

  - id: set-fields
    version: v0.36.0
    category: automation
    propose: false
    sources: ["internal/tracker/workflow_transition.go#ApplyTransitionWithFields"]
    title: "Set or clear frontmatter on transition"
    what: |
      A `set_fields` action sets or clears a frontmatter field (assignee, priority,
      human_approval, …) as part of the transition.
    why: |
      E.g. clear the assignee when work goes back to the backlog, or when it is done.
    where: "transitions[].actions[] type: set_fields (field:, value:)"
    snippet: |
      transitions:
        - from: "shipping"
          to: "done"
          actions:
            - type: "set_fields"
              field: "assignee"
              value: ""
    question: "Should any transition set or clear a field automatically?"
    detect:
      - path: transitions[].actions[].type
        one_of: [set_fields]

  - id: local-ci
    version: v0.54.0
    category: automation
    propose: true
    sources: ["internal/ci/**", "internal/tracker/ci.go", "ci_watch.go", "ci_view.go", "cmd/issue-cli/cmd_ci.go"]
    title: "Local CI on the integration branch"
    what: |
      `ci:` runs your check commands on local main after every merge, in a persistent
      worktree (.worktrees/.ci), and keeps each run in .ci/. A red run shows on the Status
      page and the board, comments `ci:` on the issues it blames, and tells the lead
      (`on_red: file_issue` also files a bug). Commands can have a `tier` (`slow` runs
      only on request) and a `failures` regex that names the failing tests.
    why: |
      Agents merge into main many times a day. Without CI nobody notices a red main
      until the next agent trips over it, and then nobody knows which merge broke it.
    where: "top-level ci: (run, tier, failures, timeout, on_red); docs/workflow.md, Local CI"
    snippet: |
      ci:
        timeout: 15m
        on_red: file_issue
        run:
          - cmd: make check
            failures: '--- FAIL: (\S+)'
          - cmd: make ux-test
            tier: slow
    question: "Which commands prove main is healthy, and which of them are too slow to run after every merge?"
    detect:
      - path: ci.run

  - id: ci-test-results
    version: v0.54.0
    category: automation
    propose: true
    requires: [local-ci]
    sources: ["internal/testresults/**", "internal/tracker/ci.go#CIResult", "cmd/issue-cli/cmd_ci_gotest.go"]
    title: "Test results from local CI"
    what: |
      Each `ci.run` command can name the result files it writes into `$CI_RESULTS_DIR`
      (`go-test-json`, `trx`, `junit` or `playtest`, as `kind: unit` or `e2e`). Local CI
      reads them into the run record, and the Health view shows test counts, runtime and
      the slowest tests over time.
    why: |
      CI only says red or green. With results you see how many tests ran, how long they
      took and which ones got slower, and the health score can count them.
    where: "ci.run[].results"
    snippet: |
      ci:
        run:
          - cmd: make check
            results:
              - {kind: unit, format: trx, file: unit.trx}
          - cmd: make ux-test
            tier: slow
            results:
              - {kind: e2e, format: playtest, file: e2e.json}
    question: "Which CI commands write test results, and in which format?"
    detect:
      - path: ci.run[].results

  # ------------------------------------------------------------------ actions
  - id: issue-actions
    version: v0.36.0
    category: actions
    propose: true
    sources: ["internal/tracker/workflow_config.go#IssueActionList", "internal/tracker/workflow_config.go#CustomAction"]
    title: "Issue action buttons"
    what: |
      `issue_actions:` adds one-shot agent buttons to the issue detail view. Each opens an
      agent session briefed with a prompt; no validation, no status change. (`actions:`
      is the deprecated name.)
    why: |
      Recurring per-issue chores (defer to a team, write a summary) become one click
      instead of a hand-written briefing every time.
    where: "new top-level issue_actions: list"
    snippet: |
      issue_actions:
        - id: "defer-to-team"
          label: "Defer to team"
          agent: "claude"
          prompt: |
            Draft a short handoff note for "{{title}}" ({{slug}}) and add it with:
            issue-cli comment {{slug}} --text "deferred: <summary>"
    question: "Any recurring per-issue chores you'd like as a one-click agent button on each issue?"
    detect:
      - path: issue_actions
      - path: actions

  - id: project-actions
    version: v0.36.0
    category: actions
    propose: true
    sources: ["internal/tracker/workflow_config.go#CustomAction", "handlers_dispatch.go#handleProjectAction", "handlers_dispatch.go#renderProjectActionPrompt"]
    title: "Project action buttons"
    what: |
      `project_actions:` adds one-shot agent buttons to the list, board and graph views.
      Prompts template with {{project}}.
    why: |
      Project-wide chores (triage the backlog, review stale issues) become one click.
    where: "new top-level project_actions: list"
    snippet: |
      project_actions:
        - id: "triage-backlog"
          label: "Triage backlog"
          agent: "claude"
          prompt: |
            Review every issue in the {{project}} backlog. Assess whether each is ready to start and
            whether its priority still looks right, then post notes with:
            issue-cli comment <slug> --text "triage: <note>"
    question: "Any recurring project-wide chores you'd like as a one-click agent button on the board?"
    detect:
      - path: project_actions

  # -------------------------------------------------------------------- board
  - id: board-columns
    version: v0.36.0
    category: board
    propose: false
    sources: ["internal/tracker/workflow_config.go#WorkflowBoardConfig", "handlers_board.go"]
    title: "Custom board columns"
    what: |
      `board.columns` sets which statuses the board shows, in order (default: the whole
      lifecycle).
    why: |
      Hide statuses nobody watches, or reorder them.
    where: "board.columns"
    snippet: |
      board:
        columns: [backlog, in progress, testing, done]
    question: "Should the board show only some statuses, or in a different order?"
    detect:
      - path: board.columns

  - id: board-card-fields
    version: v0.36.0
    category: board
    propose: false
    sources: ["internal/tracker/workflow_config.go#WorkflowBoardConfig", "templates/board.html"]
    title: "Custom board card fields"
    what: |
      `board.card_fields` picks the frontmatter fields shown on board cards (default:
      system, labels).
    why: |
      Show what matters for this project at a glance (priority, assignee, version).
    where: "board.card_fields"
    snippet: |
      board:
        card_fields: [system, labels, priority, assignee]
    question: "Which fields should board cards show?"
    detect:
      - path: board.card_fields

  - id: scoring
    version: v0.36.0
    category: board
    propose: true
    templates: [development]
    sources: ["internal/tracker/scoring.go"]
    title: "Ticket scoring and score sort"
    what: |
      An opt-in `scoring:` policy computes a score per issue from priority, due date,
      age and labels, and `scoring.default_sort: score_desc` orders the list and board
      by it. See docs/workflow.md "Scoring".
    why: |
      Helps pick what to work on next when the backlog is large.
    where: "new top-level scoring: block"
    snippet: |
      scoring:
        enabled: true
        formula:
          priority: {critical: 40, high: 20, medium: 10, low: 0}
          due_date: {urgency_weight: 2, overdue_cap: 60}
          age: {staleness_weight: 0.1}
          labels: {bug: 5}
        default_sort: score_desc
    question: "Is the backlog big enough that you want issues scored and sorted by priority automatically?"
    detect:
      - path: scoring.enabled
        equals: true

  # ---------------------------------------------------------------- workbench
  # Project-wide config for the viewer's own pages: Health, Status, System
  # pages, project pages, Metrics, Balance.
  - id: health-tuning
    version: v0.54.0
    category: workbench
    propose: true
    sources: ["internal/tracker/health.go", "internal/health/**", "health_view.go", "health_watch.go", "cmd/issue-cli/cmd_health.go", "internal/playtestruns/**"]
    title: "Health snapshot settings"
    what: |
      `health:` tunes the daily health snapshots behind the Health and Stats pages: the
      gauge limits (`limits.waiting_share`, `limits.big_files`), test file globs, which
      playtest sessions count as e2e (`e2e_sessions`), long-function and big-file sizes,
      and the derived score's components (`score`, including `lint`: issue-cli health lint's
      warnings, 0 → 20), and after how many days the daily pass shrinks a done issue's
      playtest shots (`shrink_shots_after_days`, 0 = never). Snapshots run with defaults
      without it.
    why: |
      The defaults fit a Go repo. A C#, Godot or Python project needs its own test globs
      and e2e sessions, or the tests family counts nothing and the score misleads.
    where: "top-level health: (docs/workbench-files.md, Health snapshots)"
    snippet: |
      health:
        test_globs: ["**/*Tests.cs"]
        e2e_sessions: ["playtest/sessions/*.yaml"]
        limits:
          waiting_share: 0.25
          big_files: 10
        shrink_shots_after_days: 30
    question: "Where are your tests and e2e sessions, and are the default gauge limits right for this project?"
    detect:
      - path: health

  - id: status-changelog
    version: v0.54.0
    category: workbench
    propose: true
    sources: ["release_wait.go", "status.go#readChangelog", "internal/milestone/**"]
    title: "Releases on the Status page"
    what: |
      Without `workbench.changelog` the Status page reads CHANGELOG.md at the project
      root, else git tags. The key names a different changelog: Recently released lists
      its version headings, and Waiting for release lists the `## Unreleased` entries with
      the commits not pushed yet. Releases are cut per milestone: move the
      `## Unreleased` entries under a version heading. Declined, the Status page stops
      suggesting the key.
    why: |
      The Status page shows what shipped and what is merged but not released, without
      anyone writing a status update.
    where: "workbench.changelog (default CHANGELOG.md at the project root; set it to record the feature)"
    snippet: |
      workbench:
        changelog: CHANGELOG.md
    question: "Do you keep a changelog with an ## Unreleased section, and where is it?"
    detect:
      - path: workbench.changelog

  - id: release-candidates
    version: v0.54.0
    category: workbench
    propose: false
    requires: [status-changelog]
    sources: ["release_candidate.go", "internal/milestone/rc.go", "internal/telemetry/version.go", "cmd/issue-cli/cmd_version.go#rcNote", "cmd/issue-cli/cmd_report_bug.go#rcMilestone", "internal/tracker/lead_brief.go#releaseCandidateBrief"]
    title: "Release candidates before a release"
    what: |
      `workbench.release_candidates: true` puts a soak before each release. When the
      milestone is ready, the lead tags `<version>-rc.1` locally (never pushed), installs
      that build and runs it on this machine's projects. Waiting for release shows the
      candidate: when it was cut, the commits merged after it (each needs a new rc), and,
      on the engine project, which projects ran it and the open report-bug issues filed
      from it. The release is published only on the owner's ok on a soaked candidate.
    why: |
      Nothing runs a release as a whole on real projects before it is public; a candidate
      catches what the per-issue checks miss, and bugs found in the soak stay in the
      release instead of shipping.
    where: "workbench.release_candidates"
    snippet: |
      workbench:
        release_candidates: true
    question: "Should each release run as a local release candidate on your projects before it is published?"
    detect:
      - path: workbench.release_candidates

  - id: privacy
    version: v0.54.0
    category: workbench
    propose: true
    sources: ["internal/privacy/**", "internal/tracker/privacy.go", "privacy_view.go", "tracker_watch.go", "templates/_privacy.html", "cmd/issue-cli/cmd_tracker.go", "cmd/issue-cli/cmd_privacy.go", "cmd/issue-cli/cmd_release.go", ".github/workflows/release-marker.yml", ".github/workflows/privacy-guard.yml"]
    title: "Private work files and private development"
    what: |
      `privacy:` records the owner's two choices. `work_files: tracker` keeps issues/,
      sessions/, retros/, bugs/ and .health/snapshots/ in a private tracker repo whose git
      folder sits outside the checkout, so every path stays where it is while the code repo
      ignores them; the viewer commits, pulls and pushes it every 10 minutes (`issue-cli
      tracker sync` on demand). `code: snapshots` keeps the development history in a private
      dev repo (origin) and gives the public repo ONE commit per release: a release is cut
      as release/vX.Y (`issue-cli release cut`), soaks there with fixes picked from main
      (`release pick`), and `release publish` pushes the branch tip's tree as one `vX.Y.Z`
      commit. A pre-push guard refuses work files in the code repo, dev commits to the
      public remote, and (with `code: public`) commit messages quoting a decision. Status
      shows a Work and a Code badge after the title: green private, amber something to
      fix, red work or history where it shouldn't be, grey public by choice.
    why: |
      A public dev repo publishes how the work was done, not just the result: issue bodies,
      owner quotes and D-n text in commit messages, branch names, PRs that can never be
      rewritten. Ignored instead, the work files sit on one disk with no backup.
    where: "privacy"
    snippet: |
      privacy:
        work_files: tracker        # or in_repo: keep them in the code repo, by choice
        code: snapshots            # or public: develop in the public repo
        decided: "{{today}}, owner: \"<their words>\""
    question: "Do you want your work files (issues, sessions, retros, attachments) private, in a private tracker repo, or public, in the code repo? And should development be private, with only releases published, or in the public repo?"
    setup:
      - who: agent
        do: "Record both answers in workflow.yaml privacy: with the owner's words in decided:, and with issue-cli decide when an issue is open for it."
      - who: owner
        do: "For a private tracker: create a private GitHub repo, e.g. <name>-tracker, and give the agent its URL. For private development: create a private <name>-dev too. The agent never creates repos."
      - who: agent
        do: "issue-cli tracker init --remote <tracker url>: creates or adopts the git folder outside the checkout, ignores the work paths, installs the pre-push guard, pushes the first backup."
      - who: owner
        do: "If the code repo still tracks work files, run the git rm -r --cached and commit that tracker init prints."
      - who: agent
        do: "With code: snapshots, issue-cli release setup --dev <dev url>: origin becomes the dev repo with every branch and non-candidate tag, the old origin becomes the remote public. In the release workflow, skip private repos (if: !github.event.repository.private) and take notes from the CHANGELOG. Copy .github/workflows/privacy-guard.yml from the engine repo: it fails PRs that touch work files, and every PR on the public repo."
      - who: owner
        do: "Clean the public repo's old history once, from a mirror (git filter-repo of the work paths, force push), never in the working checkout. The next release is the first snapshot (issue-cli release publish <version> --first)."
      - who: agent
        do: "issue-cli privacy check: every line green, or each fix explained to the owner. Other machines and cloud sessions clone the dev repo and the tracker, never the public repo."
    detect:
      - path: privacy

  - id: system-pages
    version: v0.54.0
    category: workbench
    propose: true
    sources: ["systems.go", "handlers_systems.go", "docsections.go", "internal/tracker/workbench.go#WorkbenchSystem", "internal/tracker/workbench.go#WorkbenchFamily"]
    title: "System page details"
    what: |
      Every issue `system:` already has a page, listed under Systems in the sidebar.
      Without `workbench.systems` each page shows the system's issues. The key adds to
      the page: a one-line summary, its design doc beside the issues, and families (an
      epic's children inside the system, each with its own page).
    why: |
      A system's issues, design doc and open questions sit on one page instead of a
      filtered list and a doc in another tab.
    where: "workbench.systems.<system>: summary, design_doc, families (the pages themselves come from `system:`)"
    snippet: |
      workbench:
        systems:
          Combat:
            summary: "Turn order, weapons and damage."
            design_doc: docs/combat.md
            umbrella: combat/combat-roadmap
            families:
              Weapons:
                umbrella: combat/weapon-overhaul
    question: "Which systems should have a summary and a design doc on their page?"
    detect:
      - path: workbench.systems

  - id: project-pages
    version: v0.54.0
    category: workbench
    propose: true
    sources: ["handlers_pages.go", "internal/tracker/workbench.go#WorkbenchPage", "internal/tracker/workbench.go#PagePaths"]
    title: "Project pages"
    what: |
      `workbench.status_page` shows your own HTML page as the default Status view (the
      built-in page stays one tab away), and `workbench.pages` lists extra pages under
      Status in the sidebar. Pages are plain files in the repo, shown sandboxed, and can
      post a live status line to the viewer.
    why: |
      A project with its own report (a balance report, a roadmap page) shows it where
      people already look, kept up to date by the agents that write it.
    where: "workbench.status_page, workbench.pages[] (title, path); docs/workbench-files.md, Project pages"
    snippet: |
      workbench:
        status_page: docs/status/index.html
        pages:
          - title: "Balance report"
            path: docs/reports/balance.html
    question: "Does the project have HTML reports worth showing in the viewer?"
    detect:
      - path: workbench.status_page
      - path: workbench.pages

  - id: metrics-and-knobs
    version: v0.54.0
    category: workbench
    propose: true
    sources: ["handlers_metrics.go", "handlers_metrics_panels.go", "internal/tracker/metrics.go", "internal/tracker/knobs.go", "internal/tracker/branches.go"]
    title: "Metrics and knobs"
    what: |
      Without `workbench.metrics` the Metrics view of a git checkout still lists its
      Branches. The key points at the probe runs your tests write (`probe_results`, in
      the format in docs/workbench-files.md) and optional target bands (`targets`);
      `workbench.tuning` at knob exports. The Metrics view then shows each guard metric
      against its band, and system pages show their own metrics and knobs. Only worth
      it when your tests already write measured values.
    why: |
      A change that moves a tuned number shows up as "off" before it ships, and agents
      can see which knobs a system has.
    where: "workbench.metrics (probe_results, targets), workbench.tuning; docs/workbench-files.md"
    snippet: |
      workbench:
        metrics:
          probe_results: docs/balance/snapshot.json
          targets: docs/balance/targets.json
        tuning:
          - build/workbench/knobs.json
        systems:
          Combat:
            metrics: [hit-rate, damage-*]
            knobs: [Weapon*]
    question: "Do your tests or probes already write measured values worth guarding, and do you export tuning knobs? (Without them the view only lists branches.)"
    detect:
      - path: workbench.metrics.probe_results
      - path: workbench.tuning

  - id: balance-board
    version: v0.54.0
    category: workbench
    propose: false
    sources: ["internal/tracker/balance.go", "handlers_balance.go", "cmd/issue-cli/cmd_balance.go"]
    title: "Balance board"
    what: |
      `workbench.balance.comment_prefix` turns typed balance notes (`issue-cli balance`)
      into the Balance view: open hypotheses per metric, what was tried, and the
      evidence.
    why: |
      Tuning a game or a simulation is many small experiments. The board keeps them
      from being lost in issue comments.
    where: "workbench.balance.comment_prefix"
    snippet: |
      workbench:
        balance:
          comment_prefix: "balance:"
    question: "Do you tune numbers through experiments you want to track?"
    detect:
      - path: workbench.balance.comment_prefix

  # ----------------------------------------------------------------- dispatch
  - id: worktree
    version: v0.36.0
    category: dispatch
    propose: true
    templates: [development]
    sources: ["internal/agentrun/**", "internal/tracker/workflow_config.go#WorktreeEnabled"]
    title: "Per-issue git worktrees on dispatch"
    what: |
      `worktree: true` makes the viewer's dispatch create a git worktree and branch per
      issue before starting the agent. `worktree_sparse_exclude` keeps paths (default
      issues/) out of it.
    why: |
      Concurrent agents stop stomping on each other's uncommitted changes, and every
      issue's work lands on its own branch.
    where: "new top-level worktree: (plus optional worktree_sparse_exclude:); optionally a Shipping box to remove the worktree after merge"
    snippet: |
      worktree: true
    question: "Do you dispatch several agents at once from the viewer, in a git repo? Should each issue get its own worktree and branch?"
    detect:
      - path: worktree
        equals: true

  - id: worktree-setup
    version: v0.36.0
    category: dispatch
    propose: false
    sources: ["internal/agentrun/**"]
    title: "Worktree setup command"
    what: |
      `worktree_setup` runs a bootstrap command (e.g. `make`) inside a newly created
      worktree; a failure aborts the dispatch.
    why: |
      Agents start in a tree that already builds, instead of each one re-discovering the
      setup steps.
    where: "top-level worktree_setup: (needs worktree: true)"
    snippet: |
      worktree: true
      worktree_setup: "make"
    question: "Does a fresh checkout need a setup command before an agent can work in it?"
    detect:
      - path: worktree_setup

  - id: lead-prompt
    version: v0.54.0
    category: dispatch
    propose: true
    sources: ["internal/tracker/lead_brief.go", "internal/tracker/lead.go", "cmd/issue-cli/cmd_lead.go"]
    title: "Project lead brief"
    what: |
      `leads.project` is the brief the project lead starts with (`issue-cli lead spawn`,
      one lead per project): what it owns, how it routes work to workers, and that it
      records your answers with `issue-cli decide --quote` in your words. It templates
      `{{project}}` and `{{lead}}`; without it the built-in brief applies. Whatever it
      says, the CLI adds the lead's limits: answer workers only from recorded decisions,
      ask you when none covers it, dispatch only the issues you name
      (`issue-cli dispatch --quote`), tick gates only with your quote.
    why: |
      The lead is the one session that sees every worker. A brief written for this
      project tells it what you care about and what it may decide alone.
    where: "top-level leads.project"
    snippet: |
      leads:
        project: |
          You are the project lead of {{project}}, running in {{lead}} in the main checkout.
          The human decides. Groom ideas, dispatch the workers the human names, relay their
          questions and approvals, and review their designs and diffs.
          Record each answer in the human's words:
          issue-cli decide <slug> --text "..." --how "lead chat" --quote "<their words>".
    question: "What should the project lead own, and what must it always bring to you?"
    detect:
      - path: leads.project

  # -------------------------------------------------------------- conventions
  # Prompt and checklist wording the bundled templates ship. The probes match
  # text, but only inside the fields that carry it.
  - id: lead-handoff-prompts
    version: v0.36.0
    category: conventions
    propose: true
    sources: ["@prompt"]
    title: "Approval gates and questions are handed to the lead"
    what: |
      Prompts before a human-approval gate (and wherever the agent needs a decision)
      tell it to say in chat exactly what it needs (which approval, which question),
      then end its turn. It doesn't wait or poll; the project lead agent (or the
      human) relays the request and sends the answer back, which resumes it.
    why: |
      A worker blocked on a gate or a question wastes a session waiting, or retries the
      transition in a loop. Handing the request to the lead keeps every worker's asks
      in one place and resumes the worker only when there is an answer. Replaces older
      prompts that told agents to block at the gate until it was approved.
    where: "statuses[].prompt of each status whose next transition has require_human_approval; also any prompt that tells the agent to stop and ask"
    snippet: |
      statuses:
        - name: "backlog"
          prompt: |
            This is a handoff state.
            Say in chat that this needs `in progress` approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
    question: "Should agents hand approval requests and questions to the lead and end their turn, instead of waiting at the gate (rewrites the prompts of statuses before each approval gate)?"
    detect:
      - path: statuses[].prompt
        contains: "end your turn"
      - path: transitions[].actions[].prompt
        contains: "end your turn"

  - id: design-overlap-discoverability
    version: v0.36.0
    category: conventions
    propose: true
    templates: [development]
    sources: ["@prompt"]
    title: "Design step reviews overlap and discoverability"
    what: |
      Two Design checkboxes and matching in-design prompt lines: list existing features
      that already do something similar (and justify or shrink the new one), and say
      how users and agents will discover and use the change.
    why: |
      Catches duplicate features before they are built, and makes the design say how
      the change reaches the people and agents who need it.
    where: "the idea → in design append_section \"Design\" body, and the \"in design\" status prompt"
    snippet: |
      transitions:
        - from: "idea"
          to: "in design"
          actions:
            - type: "append_section"
              title: "Design"
              body: |
                - [ ] Approach documented
                - [ ] Dependencies identified
                - [ ] Overlap reviewed: similar existing features listed and the need justified
                - [ ] Discoverability: how users and agents find and use this is documented
                - [ ] Human approval requested for backlog
      statuses:
        - name: "in design"
          prompt: |
            Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
            Describe how users and agents will discover and use the change.
    question: "Add the overlap and discoverability checks to the design step?"
    detect:
      - path: transitions[].actions[].body
        contains: "overlap reviewed"

  - id: sandbox-manual-tests
    version: v0.36.0
    category: conventions
    propose: true
    templates: [development]
    sources: ["@prompt"]
    title: "Manual tests run in a throwaway sandbox"
    what: |
      The Test Plan's `### Manual` boxes ask for a throwaway, gitignored sandbox scenario
      (isolated config, data and state, one setup/run/clean script) and exact human
      steps. The testing and human-testing prompts point at it.
    why: |
      The human verifies against a reproducible scenario instead of their real data,
      and the steps are written down instead of improvised.
    where: "the backlog → in progress append_section \"Test Plan\" body, plus the \"testing\" and \"human-testing\" status prompts"
    snippet: |
      transitions:
        - from: "backlog"
          to: "in progress"
          actions:
            - type: "append_section"
              title: "Test Plan"
              body: |
                ### Automated
                - [ ] Automated verification recorded

                ### Manual
                - [ ] Throwaway sandbox scenario prepared (gitignored, e.g. under `.agent-logs/<name>-sandbox/`, never committed; isolated config/data/state; never touches real user data)
                - [ ] Human steps written: exact commands to run, what to look at, expected result for each, and how to clean up
      statuses:
        - name: "testing"
          prompt: |
            For manual checks, prepare a throwaway sandbox scenario (a gitignored path such as `.agent-logs/<name>-sandbox/`, never committed): isolated config, data and state, and one script with setup/run/clean steps. It must never touch real user data or state.
            Describe it under `### Manual` in the Test Plan: where the script lives, the exact commands the human runs, what to look at, the expected result for each step, and how to clean up.
    question: "Should manual verification use a throwaway sandbox with written steps (changes the Test Plan boxes and the testing prompts)?"
    detect:
      - path: transitions[].actions[].body
        contains: "sandbox"

  - id: playtest-sessions
    version: v0.36.0
    category: conventions
    propose: true
    templates: [development]
    sources: ["cmd/playtest/**", "cmd/issue-cli/cmd_process_playtest.go", "cmd/issue-cli/guides/playtest/**"]
    title: "Manual checks as playtest sessions"
    what: |
      The testing and human-testing prompts say: if the project has a playtest system
      (`issue-cli process playtest`), write the manual checks as a playtest session
      (step id = checkbox id), pass its machine run before handing over, and point the
      human at its playtest and report commands.
    why: |
      A machine runs the repeatable checks, so the human only judges what a machine
      can't, and the report ticks the boxes that passed instead of the agent asking.
    where: "the \"testing\" and \"human-testing\" status prompts"
    snippet: |
      statuses:
        - name: "testing"
          prompt: |
            If the project has a playtest system (see `issue-cli process playtest`), write the manual checks as a playtest session (step id = checkbox id) and pass its machine run (ux-test) before handing over, so the human only judges what a machine can't.
        - name: "human-testing"
          prompt: |
            If the manual checks are a playtest session, point the human at its playtest and report commands; the report ticks the boxes that passed and comments failures as `playtest:`.
    question: "Should agents write manual checks as playtest sessions when the project has a playtest system (adds a line to the testing and human-testing prompts)?"
    detect:
      - path: statuses[].prompt
        contains: "playtest session"
      - path: transitions[].actions[].prompt
        contains: "playtest session"
      - path: transitions[].actions[].body
        contains: "playtest session"

  - id: guided-check-scripts
    version: v0.54.0
    category: conventions
    propose: true
    templates: [development]
    sources: ["internal/checks/**", "cmd/issue-cli/cmd_check_script.go", "handlers_checks.go"]
    title: "Manual checks that aren't playtests as guided check scripts"
    what: |
      Manual checks run from a shell (CLI commands, API routes, scripts, tmux) come as
      scripts/checks/<name>.sh on the issue branch, built on the helper library issue-cli
      ships (`issue-cli check-script --lib`). The owner runs one command,
      `issue-cli check-script <slug>` (▶ Run checks in the viewer): each step says what it
      checks, why, what to look at and what to expect, runs the commands, checks what a
      machine can and asks about the rest; the owner's run ticks the boxes that passed and
      comments failures as `checks:`. Adds lines to the testing, human-testing and shipping
      prompts, a Test Plan Manual box and a Shipping box (scripts stay on the branch).
    why: |
      Instead of copying, pasting and judging a list of commands, the owner answers y/n
      while the script does the rest, and the agent's sandbox, cleanup and box mapping
      live in one place that a machine run (`--yes`) checks before handover.
      It supersedes the written-steps part of sandbox-manual-tests for shell checks.
    where: "the \"testing\", \"human-testing\" and \"shipping\" status prompts, the backlog → in progress \"Test Plan\" body and the documentation → shipping \"Shipping\" body"
    snippet: |
      statuses:
        - name: "testing"
          prompt: |
            Manual checks that aren't playtest sessions (commands, API routes, scripts, tmux) come as a guided check script: start it with `issue-cli check-script <slug> --new <name>` (scripts/checks/<name>.sh on the issue branch), read the helpers in `issue-cli check-script --lib`, name the box each step proves with `--box`, and pass `issue-cli check-script <slug> --yes` before handing over. Never tick the owner's Manual boxes yourself.
        - name: "human-testing"
          prompt: |
            If the issue has a guided check script, the human runs `issue-cli check-script <slug>` (▶ Run checks in the viewer): it ticks the boxes that passed and comments failures as `checks:`.
        - name: "shipping"
          prompt: |
            Remove the issue's scripts/checks/<name>.sh in a last commit before the merge: check scripts stay on the issue branch.
      transitions:
        - from: "backlog"
          to: "in progress"
          actions:
            - type: "append_section"
              title: "Test Plan"
              body: |
                ### Manual
                - [ ] Manual checks that aren't playtests come as `scripts/checks/<name>.sh` (`issue-cli check-script <slug> --new <name>`), or N/A with the reason
        - from: "documentation"
          to: "shipping"
          actions:
            - type: "append_section"
              title: "Shipping"
              body: |
                - [ ] Check scripts (scripts/checks/<name>.sh) removed in a last commit before the merge, or none
    question: "Should manual checks that run from a shell come as guided check scripts the owner runs with one command (adds lines to the testing, human-testing and shipping prompts and two checklist boxes)?"
    detect:
      - path: statuses[].prompt
        contains: "check-script"
      - path: transitions[].actions[].body
        contains: "check-script"

  - id: testing-unrelated-failures
    version: v0.36.0
    category: conventions
    propose: true
    templates: [development]
    sources: ["@prompt"]
    title: "Unrelated test failures are documented, not blocking"
    what: |
      A Testing checkbox and an inject_prompt line: if unrelated failures make the full
      suite red, document them explicitly instead of stalling or "fixing" them.
    why: |
      Agents either get stuck on a red suite they didn't break or wander off fixing
      unrelated code. This gives them a defined way through.
    where: "the in progress → testing append_section \"Testing\" body and its inject_prompt"
    snippet: |
      transitions:
        - from: "in progress"
          to: "testing"
          actions:
            - type: "append_section"
              title: "Testing"
              body: |
                - [ ] Relevant tests for changed code passing
                - [ ] Known unrelated failures documented if full suite is red
                - [ ] Test results logged as comment (`issue-cli comment <slug> --text "tests: ..."`)
            - type: "inject_prompt"
              prompt: |
                Run the relevant tests for the changed code, record results, and capture any remaining manual checks.
                If unrelated failures block the full suite, document them explicitly.
    question: "Add the 'document unrelated failures' rule to the testing step?"
    detect:
      - path: transitions[].actions[].body
        contains: "unrelated failures"
      - path: transitions[].actions[].prompt
        contains: "unrelated failures"

  - id: local-merge-shipping
    version: v0.54.0
    category: conventions
    propose: true
    templates: [development]
    sources: ["@prompt"]
    title: "Ship by local merge"
    what: |
      The shipping prompt and checklist ship without a remote: merge local main into the
      branch, run the project's checks, fast-forward the main checkout to the branch
      (`git -C <main checkout> merge --ff-only <branch>`) and never push. The change goes
      under `## Unreleased` in the changelog; releases are cut per milestone and pushed by
      the lead when you ask. The bundled template keeps push: this is opt-in.
    why: |
      With many agents on one machine, pushes and pull requests per issue are noise. Local
      main stays the integration branch, local CI checks every move, and you choose when
      a milestone leaves the machine.
    where: "the shipping status prompt and the Shipping checklist (its append_section)"
    snippet: |
      statuses:
        - name: "shipping"
          prompt: |
            1. Add your change under `## Unreleased` in CHANGELOG.md. Don't bump the version.
            2. Commit on your branch.
            3. `git merge main` (the local branch), resolve conflicts, run the checks.
            4. Fast-forward the main checkout to your branch: `git -C <main checkout> merge --ff-only <your branch>`. If main moved, repeat step 3. Never push.
            5. Comment `shipped: <sha> fast-forwarded into main`.
    question: "Should agents ship by fast-forwarding local main, never pushing, with releases per milestone?"
    detect:
      - path: statuses[].prompt
        contains: "merge --ff-only"
