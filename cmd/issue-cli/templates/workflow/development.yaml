# Bundled template stamp: which template this file came from and the
# issue-cli release that last changed it. `issue-cli workflow upgrade` compares
# it with the template bundled in the binary and proposes newer features.
# Set it to `custom` if this workflow is no longer based on a template.
template: development@v0.36.0

# Feature record: catalog features this file has (<id>@<version>) and the
# ones the human declined. Written by `issue-cli workflow scan`, read by
# `issue-cli workflow upgrade`.
features:
  installed:
    - status-prompts@v0.36.0
    - types-of-work@v0.36.0
    - human-approval-gates@v0.36.0
    - checklist-gates@v0.36.0
    - assignee-gate@v0.36.0
    - test-plan-gate@v0.36.0
    - comment-evidence-gates@v0.36.0
    - body-structure-gates@v0.36.0
    - failure-hints@v0.36.0
    - checklist-sections@v0.36.0
    - transition-prompts@v0.36.0
    - set-fields@v0.36.0
    - project-actions@v0.36.0
    - board-columns@v0.36.0
    - board-card-fields@v0.36.0
    - lead-handoff-prompts@v0.36.0
    - design-overlap-discoverability@v0.36.0
    - sandbox-manual-tests@v0.36.0
    - playtest-sessions@v0.36.0
    - testing-unrelated-failures@v0.36.0

board:
  columns:
    - idea
    - in design
    - backlog
    - in progress
    - testing
    - human-testing
    - documentation
    - shipping
    - done
  card_fields:
    - system
    - labels
    - priority
    - assignee

# Local CI (opt-in; docs/workflow.md, "Local CI"): run your checks on the
# integration branch after every move, in .worktrees/.ci, and report red to
# the Status page, the merged issues and the lead. issue-cli ci status shows
# the state. Uncomment and list your own commands:
# ci:
#   timeout: 20m
#   run:
#     - make test
#     - cmd: make e2e
#       tier: slow      # only with issue-cli ci run --tier slow

statuses:
  - name: "idea"
    description: "Raw idea, needs exploration"
    prompt: |
      Clarify the issue with the human before moving into structured design.
      Ask focused questions to remove ambiguity around goals, scope, and success criteria.
  - name: "in design"
    description: "Being designed and specced out"
    prompt: |
      Review the relevant context before proposing changes.
      Turn the problem into explicit checklists, assumptions, and open questions.
      Write the design into the issue body under the relevant sections before checking the related boxes.
      Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
      Describe how users and agents will discover and use the change.
      When the design is complete, say in chat that it needs `backlog` approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
  - name: "backlog"
    description: "Ready to work on"
    prompt: |
      This is a handoff state.
      Say in chat that this needs `in progress` approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
  - name: "in progress"
    description: "Actively being implemented"
    prompt: |
      Implement the accepted design and keep the issue body, implementation checklist, and test plan accurate as work progresses.
      Record implementation notes and planned verification steps in the issue body; checkboxes mark completion but do not replace written content.
  - name: "testing"
    description: "Under verification"
    prompt: |
      Build or update the relevant automated coverage, record concrete test evidence, and surface any remaining manual checks clearly.
      Before checking test-related boxes, make sure the Test Plan section in the issue body contains the explicit automated and manual steps being verified.
      For manual checks, prepare a throwaway sandbox scenario (a gitignored path such as `.agent-logs/<name>-sandbox/`, never committed): isolated config, data and state, and one script with setup/run/clean steps. It must never touch real user data or state.
      Describe it under `### Manual` in the Test Plan: where the script lives, the exact commands the human runs, what to look at, the expected result for each step, and how to clean up.
      If the project has a playtest system (see `issue-cli process playtest`), write the manual checks as a playtest session (step id = checkbox id) and pass its machine run (ux-test) before handing over, so the human only judges what a machine can't.
  - name: "human-testing"
    description: "Manual verification by humans"
    prompt: |
      Say in chat which manual checks to run and that `documentation` needs approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
      Make sure the manual checks are explicit, minimal, and reproducible.
      Point the human at the sandbox scenario and the `### Manual` steps in the Test Plan; do not ask them to verify against real data.
      If the manual checks are a playtest session, point the human at its playtest and report commands; the report ticks the boxes that passed and comments failures as `playtest:`.
  - name: "documentation"
    description: "Being documented"
    prompt: |
      Update the relevant docs for the change and record the documentation work clearly.
  - name: "shipping"
    description: "Committing and pushing changes"
    prompt: |
      Commit the changes with a message referencing the issue, push the commit to the remote, and note a PR link if one is opened.
      Tell the human in chat that this needs `done` approval in the issue viewer once the commit is pushed; only humans close issues.
  - name: "done"
    description: "Completed"

transitions:
  - from: "idea"
    to: "in design"
    actions:
      - type: "validate"
        rule: "body_not_empty"
      - type: "append_section"
        title: "Idea"
        body: |
          - [ ] Description written with enough context for someone unfamiliar
          - [ ] Edge cases and constraints identified
          - [ ] Scope is clear (what is NOT included)
      - type: "append_section"
        title: "Design"
        body: |
          - [ ] Approach documented
          - [ ] Dependencies identified
          - [ ] Overlap reviewed: similar existing features listed and the need justified
          - [ ] Discoverability: how users and agents find and use this is documented
          - [ ] Human approval requested for backlog
      - type: "append_section"
        title: "Acceptance Criteria"
        body: |
          - [ ] First observable requirement
          - [ ] Second observable requirement
  - from: "in design"
    to: "backlog"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Design"
      - type: "validate"
        rule: "section_has_checkboxes: Acceptance Criteria"
      - type: "require_human_approval"
        status: "backlog"
      - type: "set_fields"
        field: "assignee"
        value: ""
  - from: "backlog"
    to: "in progress"
    actions:
      - type: "require_human_approval"
        status: "in progress"
      - type: "validate"
        rule: "has_assignee"
      - type: "append_section"
        title: "Implementation"
        body: |
          - [ ] Code changes complete
          - [ ] Automated tests added or updated where practical
          - [ ] Cross-cutting impact reviewed where relevant
      - type: "append_section"
        title: "Test Plan"
        body: |
          ### Automated
          - [ ] Automated verification recorded

          ### Manual
          - [ ] Throwaway sandbox scenario prepared (gitignored, e.g. under `.agent-logs/<name>-sandbox/`, never committed; isolated config/data/state; never touches real user data)
          - [ ] Human steps written: exact commands to run, what to look at, expected result for each, and how to clean up
  - from: "in progress"
    to: "testing"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Implementation"
      - type: "validate"
        rule: "has_test_plan"
      - type: "append_section"
        title: "Testing"
        body: |
          - [ ] Relevant tests for changed code passing
          - [ ] Known unrelated failures documented if full suite is red
          - [ ] Test results logged as comment (`issue-cli comment <slug> --text "tests: ..."`)
      - type: "inject_prompt"
        prompt: |
          Run the relevant tests for the changed code, record results, and capture any remaining manual checks.
          If unrelated failures block the full suite, document them explicitly.
  - from: "testing"
    to: "human-testing"
    actions:
      - type: "validate"
        rule: "has_test_plan"
      - type: "validate"
        rule: "section_checkboxes_checked: Testing"
      - type: "validate"
        rule: "has_comment_prefix: tests:"
      - type: "append_section"
        title: "Human Testing"
        body: |
          - [ ] Human verification complete if required
  - from: "human-testing"
    to: "documentation"
    actions:
      - type: "require_human_approval"
        status: "documentation"
      - type: "append_section"
        title: "Documentation"
        body: |
          - [ ] User-facing docs updated if behavior changed
          - [ ] Docs comment added (`issue-cli comment <slug> --text "docs: ..."`)
  - from: "documentation"
    to: "shipping"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Documentation"
      - type: "validate"
        rule: "has_comment_prefix: docs:"
      - type: "append_section"
        title: "Shipping"
        body: |
          - [ ] Changes committed with a message referencing the issue
          - [ ] Commit pushed to the remote
          - [ ] PR opened if applicable
  - from: "shipping"
    to: "done"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Shipping"
      - type: "require_human_approval"
        status: "done"

# Types of work: an issue's `type:` frontmatter picks its path through the
# statuses above. Untyped issues get default_type. Set the type at creation
# (`issue-cli create --type <t>`) or with `issue-cli set-type` while the issue
# is at its first status. See docs/Workflow/types.md.
default_type: feature

types:
  feature:
    description: "New behaviour: the full path through design, testing and docs"
    # no path: every base status and edge

  tweak:
    description: "A small change the human already decided (their words in the body); no design, no new behaviour"
    path: [idea, in progress, testing, shipping, done]
    statuses:
      - name: "in progress"
        prompt: |
          Tweak: build exactly what the body says the human decided, nothing more. No design doc.
          If it turns out to need new behaviour or a design decision, say in chat that the type should change to feature (in the issue viewer) and end your turn.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Implementation"
            body: |
              - [ ] Change made as decided, nothing more
              - [ ] Automated tests added or updated where practical
          - type: "append_section"
            title: "Test Plan"
            body: |
              ### Automated
              - [ ] Automated verification recorded

              ### Manual
              - [ ] Manual check listed if the change is visible
      - from: "testing"
        to: "shipping"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Testing"
          - type: "validate"
            rule: "has_comment_prefix: tests:"
          - type: "require_human_approval"
            status: "shipping"
          - type: "append_section"
            title: "Shipping"
            body: |
              - [ ] Changes committed with a message referencing the issue
              - [ ] Commit pushed to the remote
              - [ ] PR opened if applicable

  bugfix:
    description: "Something that worked is broken: a repro and a failing test first, then the fix"
    path: [idea, in progress, testing, human-testing, documentation, shipping, done]
    statuses:
      - name: "idea"
        prompt: |
          A bug: write a `## Repro` section with the exact steps or test, what happens, what should happen, and since when if known.
          Then say in chat that it needs `in progress` approval in the issue viewer, and end your turn; the lead (or the human) resumes you once it is approved.
      - name: "in progress"
        prompt: |
          Bugfix: first write a test that fails on the bug, then fix it. No design doc.
          If the fix changes behaviour the design decided, say in chat that the type should change to feature (in the issue viewer) and end your turn.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "has_section"
            section: "Repro"
            hint: "issue-cli append {{slug}} --body \"## Repro\\n<steps>, what happens, what should happen\""
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Implementation"
            body: |
              - [ ] Failing test written first
              - [ ] Fix makes it pass; no other behaviour changes
          - type: "append_section"
            title: "Test Plan"
            body: |
              ### Automated
              - [ ] Automated verification recorded

              ### Manual
              - [ ] Repro steps re-run and the bug is gone

# One-shot agent buttons on the project views (list/board/graph). Each opens an
# agent session briefed with the prompt; no validation, no status change.
# issue_actions: does the same on the issue detail view ({{slug}}, {{title}}, …).
project_actions:
  - id: "triage-backlog"
    label: "Triage backlog"
    agent: "claude"
    prompt: |
      Review every issue in the {{project}} backlog. For each, assess whether the
      design is clear enough to start and whether its priority still looks right.
      Summarize a recommended order to pick up next and flag anything blocked or
      stale, then post it with: issue-cli comment <slug> --text "triage: <note>"
