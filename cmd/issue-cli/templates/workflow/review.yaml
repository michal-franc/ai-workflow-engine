# Bundled template stamp: which template this file came from and the
# issue-cli release that last changed it. `issue-cli workflow upgrade` compares
# it with the template bundled in the binary and proposes newer features.
# Set it to `custom` if this workflow is no longer based on a template.
template: review@v0.34.0

# Feature record: catalog features this file has (<id>@<version>) and the
# ones the human declined. Written by `issue-cli workflow scan`, read by
# `issue-cli workflow upgrade`.
features:
  installed:
    - status-prompts@v0.34.0
    - human-approval-gates@v0.34.0
    - checklist-gates@v0.34.0
    - assignee-gate@v0.34.0
    - comment-evidence-gates@v0.34.0
    - body-structure-gates@v0.34.0
    - checklist-sections@v0.34.0
    - project-actions@v0.34.0
    - board-columns@v0.34.0
    - board-card-fields@v0.34.0
    - lead-handoff-prompts@v0.34.0

board:
  columns:
    - inbox
    - triaged
    - reviewing
    - needs-changes
    - approved
    - archived
  card_fields:
    - labels
    - priority
    - assignee

statuses:
  - name: "inbox"
    description: "New incoming item, not yet looked at"
    prompt: |
      A new item has landed. Read it end-to-end before doing anything else.
      Decide whether it has enough context to be triaged, or whether the submitter needs to provide more.
  - name: "triaged"
    description: "Categorised and ready for review"
    prompt: |
      Confirm the item is in scope, label it, and set a priority.
      When the item is ready for an actual review pass, transition to reviewing.
  - name: "reviewing"
    description: "Active review in progress"
    prompt: |
      Read the item carefully and write your review notes directly into the issue body.
      Decide on one of two outcomes: approved (ready to land) or needs-changes (sender must revise).
      To approve, say in chat that it needs `approved` approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
  - name: "needs-changes"
    description: "Sent back to the author for revisions"
    prompt: |
      Wait for the author to address review feedback.
      When they have responded, move back to reviewing for another pass.
  - name: "approved"
    description: "Review complete and approved"
    prompt: |
      Approval is recorded. The item is ready to be archived once any follow-up actions are taken.
      Say in chat that it needs `archived` approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
  - name: "archived"
    description: "Closed out, no further action"

transitions:
  - from: "inbox"
    to: "triaged"
    actions:
      - type: "validate"
        rule: "body_not_empty"
      - type: "append_section"
        title: "Triage"
        body: |
          - [ ] Scope confirmed
          - [ ] Labels and priority set
          - [ ] Reviewer identified
  - from: "triaged"
    to: "reviewing"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Triage"
      - type: "validate"
        rule: "has_assignee"
      - type: "append_section"
        title: "Review Notes"
        body: |
          - [ ] Item read in full
          - [ ] Review notes written
          - [ ] Decision recorded (approve or request changes)
  - from: "reviewing"
    to: "needs-changes"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Review Notes"
      - type: "append_section"
        title: "Requested Changes"
        body: |
          - [ ] Changes listed clearly for the author
  - from: "needs-changes"
    to: "reviewing"
    actions:
      - type: "validate"
        rule: "has_comment_prefix: response:"
  - from: "reviewing"
    to: "approved"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Review Notes"
      - type: "require_human_approval"
        status: "approved"
  - from: "approved"
    to: "archived"
    actions:
      - type: "require_human_approval"
        status: "archived"

# One-shot agent buttons on the project views (list/board/graph). Each opens an
# agent session briefed with the prompt; no validation, no status change.
# issue_actions: does the same on the issue detail view ({{slug}}, {{title}}, …).
project_actions:
  - id: "triage-inbox"
    label: "Triage inbox"
    agent: "claude"
    prompt: |
      Read every item in the {{project}} inbox. For each, say whether it has enough
      context to triage, suggest labels and a priority, and flag anything that needs
      more from the submitter. Post each note with:
      issue-cli comment <slug> --text "triage: <note>"
