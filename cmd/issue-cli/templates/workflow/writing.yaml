# Bundled template stamp: which template this file came from and the
# issue-cli release that last changed it. `issue-cli workflow upgrade` compares
# it with the template bundled in the binary and proposes newer features.
# Set it to `custom` if this workflow is no longer based on a template.
template: writing@v0.54.0

# Feature record: catalog features this file has (<id>@<version>) and the
# ones the human declined. Written by `issue-cli workflow scan`, read by
# `issue-cli workflow upgrade`.
features:
  installed:
    - status-prompts@v0.36.0
    - human-approval-gates@v0.36.0
    - checklist-gates@v0.36.0
    - comment-evidence-gates@v0.36.0
    - body-structure-gates@v0.36.0
    - checklist-sections@v0.36.0
    - project-actions@v0.36.0
    - board-columns@v0.36.0
    - board-card-fields@v0.36.0
    - lead-handoff-prompts@v0.36.0

board:
  columns:
    - idea
    - outline
    - drafting
    - editing
    - review
    - published
  card_fields:
    - labels
    - priority
    - assignee

statuses:
  - name: "idea"
    description: "Raw concept for a piece"
    prompt: |
      Capture what this piece is about, who it is for, and what the reader should walk away with.
      Sharpen the angle before moving to outline.
  - name: "outline"
    description: "Structuring the piece"
    prompt: |
      Build a section-by-section outline. Each section should have a clear point — not just a heading.
      Confirm the outline holds together before drafting full prose.
  - name: "drafting"
    description: "Writing the first full draft"
    prompt: |
      Write the full draft following the agreed outline.
      Prefer momentum over polish at this stage; do not edit while drafting.
  - name: "editing"
    description: "Self-edit pass"
    prompt: |
      Read the draft cold. Cut what does not earn its keep.
      Tighten language, fix structure, and verify every claim.
      When the edit is done, say in chat that it needs `review` approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
  - name: "review"
    description: "Out for outside review"
    prompt: |
      Wait for review feedback.
      When feedback is in, decide whether to revise (back to editing) or proceed to publish.
      To publish, say in chat that it needs `published` approval in the issue viewer, then end your turn. Don't wait or poll: the lead (or the human) relays the request and resumes you once it is approved.
  - name: "published"
    description: "Live"

transitions:
  - from: "idea"
    to: "outline"
    actions:
      - type: "validate"
        rule: "body_not_empty"
      - type: "append_section"
        title: "Outline"
        body: |
          - [ ] Audience and angle stated
          - [ ] Section list with one-line purpose for each
          - [ ] Key references gathered
  - from: "outline"
    to: "drafting"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Outline"
      - type: "append_section"
        title: "Draft"
        body: |
          - [ ] First full draft written
          - [ ] All outline sections covered
  - from: "drafting"
    to: "editing"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Draft"
      - type: "append_section"
        title: "Edit"
        body: |
          - [ ] Cold read complete
          - [ ] Cuts and rewrites applied
          - [ ] Claims fact-checked
  - from: "editing"
    to: "review"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Edit"
      - type: "require_human_approval"
        status: "review"
      - type: "append_section"
        title: "Review"
        body: |
          - [ ] Feedback gathered
          - [ ] Revisions applied or explicitly declined
  - from: "review"
    to: "editing"
    actions:
      - type: "validate"
        rule: "has_comment_prefix: revise:"
  - from: "review"
    to: "published"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Review"
      - type: "require_human_approval"
        status: "published"

# One-shot agent buttons on the project views (list/board/graph). Each opens an
# agent session briefed with the prompt; no validation, no status change.
# issue_actions: does the same on the issue detail view ({{slug}}, {{title}}, …).
project_actions:
  - id: "editorial-review"
    label: "Editorial review"
    agent: "claude"
    prompt: |
      Review every piece in {{project}} that is not yet published. For each, note
      where it is stuck, what the next concrete step is, and whether its priority
      still looks right. Post each note with:
      issue-cli comment <slug> --text "editorial: <note>"
