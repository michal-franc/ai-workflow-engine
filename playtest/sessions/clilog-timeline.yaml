session: clilog-timeline
issue: cli/clilog-and-stats-record-what-the-timeline-needs
title: The clilog records each call's result without free text; the Agent Timeline still reads well
scenario: basic

# Desktop only: the Agent Timeline has no phone-specific layout.
session_checks:
  viewports: [1440x900]
  console: no_errors

steps:
  - id: TP4
    title: A comment and a refused gate show on the issue's Agent Timeline; the comment's text comes from the issue
    setup:
      - open: /p/{project}/issue/cli/export-issues-as-csv
    act:
      - cli: [comment, cli/export-issues-as-csv, --text, "progress: plan ready, waiting on the owner for in progress"]
      - cli: { args: [transition, cli/export-issues-as-csv, --to, "in progress"], exit: 1 }
      - reload: true
    checks:
      - exists: detail.timeline
      - text_contains: { target: detail.timeline, text: "progress: plan ready, waiting on the owner for in progress" }
      - text_contains: { target: detail.timeline, text: "transition → in progress (failed: approval missing)" }
    targets:
      - { id: detail.timeline, note: "Your comment and the refused transition, newest last" }
    do: Look at the Agent Timeline under the issue body, then at the comment under it.
    expect: >-
      The Agent Timeline lists the comment with its full text and the transition marked
      "failed: approval missing". The comment under the body shows only its day.
    why: >-
      The clilog no longer keeps the words typed into issue-cli: the timeline takes the
      comment's text from the issue, and each call now records whether it failed and why.
