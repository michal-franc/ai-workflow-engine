    - local-merge-shipping@v0.54.0
  declined:
    - shell-gate
    - scoring

# Issue-viewer dispatches concurrent agents on different issues, so each
# session needs its own working tree to avoid stomping on uncommitted state.
worktree: true

# Local CI (docs/workflow.md, "Local CI"): every move of local main runs
# make validate in .worktrees/.ci and reports red to the Status page, the
# merged issues and the lead. ux-test is the slow tier, run on request:
# issue-cli ci run --tier slow.
ci:
  timeout: 20m
  run:
    - cmd: make validate
      failures: '--- FAIL: (\S+)'
      results:
        - {kind: unit, format: go-test-json, file: unit.json}
    - cmd: make ux-test
      tier: slow
      results:
        - {kind: e2e, format: playtest, file: e2e.json}

# The Status page lists recent releases from the CLI's changelog (the repo
# root has none: go:embed keeps it next to the CLI). System pages
# (/p/issue-viewer/systems) take a summary and design doc per issue `system`,
# and families: an umbrella issue's children inside a system.
# release_candidates: each release first runs as a local <version>-rc.N on
# this machine's projects, and is published only on the owner's ok.
workbench:
  changelog: cmd/issue-cli/CHANGELOG.md
  release_candidates: true
  systems:
    UI:
      summary: "Templates, views and client-side behaviour of the viewer: list, board, canvases, detail page and the workbench pages."
      design_doc: docs/UI/overview.md
      families:
        Workbench:
          summary: "The workbench redesign: system pages, balance board, decisions index, status page and the new frame."
          umbrella: ui/workbench-redesign-inbox-system-pages-balance-board-and-decisions-index
    CLI:
      summary: "issue-cli commands and their output contracts."
      design_doc: docs/CLI/overview.md
    Workflow:
      summary: "The workflow engine: statuses, transitions, overlays and types of work."
      design_doc: docs/Workflow/overview.md
    API:
      summary: "HTTP endpoints, handlers and server logic."
      design_doc: docs/API/overview.md

board:
  columns:
    - idea
    - in design
    - backlog
    - in progress
    - testing
    - human-testing
    - documentation
    - shipping
    - done
    - parked
  card_fields:
    - system
    - labels
    - priority
    - assignee

statuses:
  - name: "idea"
    description: "Raw idea, needs exploration"
    prompt: |
      Clarify the issue with the human before moving into structured design.
      Ask focused questions to remove ambiguity around goals, scope, and success criteria.
  - name: "in design"
    description: "Being designed and specced out"
    prompt: |
      Review the relevant context before proposing changes.
      Turn the problem into explicit checklists, assumptions, and open questions.
      Write the design into the issue body under the relevant sections before checking the related boxes.
      Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
      Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
      When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
  - name: "backlog"
    description: "Ready to work on"
    prompt: |
      This is a handoff state.
      Tell the human in chat that this needs `in progress` approval in the issue viewer, then stop and end your turn; continue when the human messages you that it is approved.
  - name: "in progress"
    description: "Actively being implemented"
    prompt: |
      Implement the accepted design and keep the issue body, implementation checklist, and test plan accurate as work progresses.
      Record implementation notes and planned verification steps in the issue body; checkboxes mark completion but do not replace written content.
      Declare each acceptance criterion's proof where you write it: `proves: [AC2]` on the playtest step that shows it, a `Proves: AC2 <TestName>` trailer on the commit that adds or changes the test, or `Proves: AC2` on the commit that is the change. `issue-cli prove <slug> --list` shows what is proven.
  - name: "testing"
    description: "Under verification"
    prompt: |
      Build or update the relevant automated coverage, record concrete test evidence, and surface any remaining manual checks clearly.
      Before checking test-related boxes, make sure the Test Plan section in the issue body contains the explicit automated and manual steps being verified.
      Write the manual checks as a playtest session, playtest/sessions/<name>.yaml (how: issue-cli process playtest web, docs/patterns/playtest/web-app.md): step id = the Test Plan checkbox id, a scenario from playtest/scenarios/ (add one if none fits; fixtures under tracker/, never issues/), machine checks for everything a machine can see, and expect:/do:/why: only for what needs the owner's eye. New elements a step points at get a data-testid listed in internal/testids/testids.go.
      Run `make playtest-check`, single `make ux-test ISSUE=<slug>` runs while fixing, and `make ux-test ISSUE=<slug> REPEAT=2` once, as the final run before handing over. The runner builds the scenario: never point a session at the real projects.yaml, issues tree, user state or tmux server.
      A manual check a session can't drive (CLI commands, API routes, tmux, a terminal-only flow) comes as a guided check script: start it with `issue-cli check-script <slug> --new <name>` (scripts/checks/<name>.sh on the issue branch), read the helpers in `issue-cli check-script --lib` (sandbox_project, private_tmux, clean_shell with a stand-in claude, --touches-real for anything in the owner's real session), name the box each step proves with `--box`, and pass `issue-cli check-script <slug> --yes` before handing over. Never tick the owner's Manual boxes yourself. Its sandbox never touches the real projects.yaml, issues tree, user state or tmux server.
  - name: "human-testing"
    description: "Manual verification by humans"
    prompt: |
      Ask the human to run `make playtest ISSUE=<slug>` in the worktree (only the judgement steps, in an overlay on a scenario board; it reuses your last ux-test) and then `make playtest-report ISSUE=<slug> APPLY=1` (ticks the Manual boxes that passed, comments each failure and opinion), plus `issue-cli check-script <slug>` when the issue has a guided check script (▶ Run checks in the viewer; it ticks the boxes that passed and comments failures as `checks:`). Then ask them to approve `documentation` in the issue viewer, stop and end your turn; continue when the human messages you that it is approved.
      Make sure the manual checks are explicit, minimal, and reproducible; do not ask the human to verify against real projects or data.
      Read `playtest:` and `checks:` comments as test results: fix each failure, and answer or act on each opinion.
  - name: "documentation"
    description: "Being documented"
    prompt: |
      Update the relevant docs for the change and record the documentation work clearly.
  - name: "shipping"
    description: "Committing and merging into local main"
    prompt: |
      Ship by merging into the local main checkout. There are no pull requests (never open one) and you never push: the lead pushes main to origin when the owner asks, usually to cut a release.
      You reach shipping only after the owner has run your playtest and approved documentation, so merging into local main is part of your job here: do it without asking first.
      1. Add your user-facing change summary under `## Unreleased` at the top of `cmd/issue-cli/CHANGELOG.md` (create the heading if a release just took it). Do not add a version heading or bump the version: the lead cuts releases per milestone (docs/roadmap.md). Never create or push tags.
      2. Commit on your branch with a message referencing the issue. Then remove your scripts/checks/<name>.sh in its own commit: check scripts stay on the issue branch and never reach main.
      3. `git merge main` (the local branch, not origin/main), resolve any conflicts, and run `make validate`. Keep both sides' entries under `## Unreleased` when the CHANGELOG conflicts.
      4. Fast-forward the main checkout (the first path in `git worktree list`) to your branch: `git -C <main checkout> merge --ff-only <your branch>`. If it refuses because main moved, repeat step 3. If it refuses because the main checkout has uncommitted changes in files you touch, stop and tell the lead. Never force anything and never `git push`.
      After the fast-forward, local CI tests main by itself (`issue-cli ci status`). Never wait for it: if it goes red on your merge, the lead may re-open your issue.
      Before closing, post a `risk:` comment (`issue-cli comment <slug> --text "risk: ..."`) for anything to watch after the ship, or "risk: none".
      Once your commit is on local main and the Shipping boxes are ticked, move the issue to `done` yourself (`issue-cli transition <slug> --to "done"`); it needs no human approval. Polishing the GitHub release description is the human's responsibility. Leave the worktree as it is: nobody has to remove it.
  - name: "done"
    description: "Completed"
  - name: "parked"
    description: "Blocked, deferred or won't do, with a recorded reason"
    optional: true
    global: true
    prompt: |
      This issue is parked. Don't work on it. If you were dispatched onto it, tell the human it is parked (the reason is under ## Parked Record) and end your turn.

transitions:
  - from: "idea"
    to: "in design"
    actions:
      - type: "validate"
        rule: "body_not_empty"
      - type: "append_section"
        title: "Idea"
        body: |
          - [ ] Description written with enough context for someone unfamiliar
          - [ ] Edge cases and constraints identified
          - [ ] Scope is clear (what is NOT included)
      - type: "append_section"
        title: "Design"
        body: |
          - [ ] Approach documented
          - [ ] Dependencies identified
          - [ ] Overlap reviewed: similar existing features listed and the need justified
          - [ ] Discoverability: how agents find and use this is documented
          - [ ] Catalog: the entry this adds, or the entry whose version: it bumps (id, detect, sources), or n/a
          - [ ] Human approval requested (backlog, or in progress to start straight away)
      - type: "append_section"
        title: "Acceptance Criteria"
        body: |
          - [ ] First observable requirement
          - [ ] Second observable requirement
  - from: "in design"
    to: "backlog"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Design"
      - type: "validate"
        rule: "section_has_checkboxes: Acceptance Criteria"
      - type: "validate"
        rule: "criteria_checkboxes: Acceptance Criteria"
      - type: "require_human_approval"
        status: "backlog"
      - type: "set_fields"
        field: "assignee"
        value: ""
  # Optional shortcut: start building straight from design, skipping the
  # backlog queue. The human approves `in progress` from `in design` instead.
  - from: "in design"
    to: "in progress"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Design"
      - type: "validate"
        rule: "section_has_checkboxes: Acceptance Criteria"
      - type: "validate"
        rule: "criteria_checkboxes: Acceptance Criteria"
      - type: "require_human_approval"
        status: "in progress"
      - type: "validate"
        rule: "has_assignee"
      - type: "append_section"
        title: "Implementation"
        body: |
          - [ ] Code changes complete
          - [ ] Automated tests added or updated where practical
          - [ ] Cross-cutting impact reviewed where relevant
      - type: "append_section"
        title: "Test Plan"
        body: |
          ### Automated
          - [ ] Automated verification recorded
          
          ### Manual
          - [ ] Throwaway sandbox scenario prepared (worktree-only, gitignored e.g. under `.agent-logs/<name>-sandbox/`, never committed; isolated config/issues/state; never touches real projects.yaml, issues, or user state)
          - [ ] Manual checks that aren't playtests come as `scripts/checks/<name>.sh` (`issue-cli check-script <slug> --new <name>`), or N/A with the reason
  - from: "backlog"
    to: "in progress"
    actions:
      - type: "require_human_approval"
        status: "in progress"
      - type: "validate"
        rule: "has_assignee"
      - type: "append_section"
        title: "Implementation"
        body: |
          - [ ] Code changes complete
          - [ ] Automated tests added or updated where practical
          - [ ] Cross-cutting impact reviewed where relevant
      - type: "append_section"
        title: "Test Plan"
        body: |
          ### Automated
          - [ ] Automated verification recorded
          
          ### Manual
          - [ ] Manual checks written as a playtest session (`playtest/sessions/<name>.yaml`, step id = checkbox id; judgement steps only for what needs the owner) and `make playtest-check` passes (or N/A with reason)
          - [ ] Manual checks that aren't playtests come as `scripts/checks/<name>.sh` (`issue-cli check-script <slug> --new <name>`), or N/A with the reason
  - from: "in progress"
    to: "testing"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Implementation"
      - type: "validate"
        rule: "has_test_plan"
      - type: "append_section"
        title: "Testing"
        body: |
          - [ ] Relevant tests for changed code passing
          - [ ] Known unrelated failures documented if full suite is red
          - [ ] Test results logged as comment (`issue-cli comment <slug> --text "tests: ..."`)
          - [ ] `make ux-test ISSUE=<slug> REPEAT=2` passed, run once before handoff (or N/A: no playtest session, with reason)
      - type: "inject_prompt"
        prompt: |
          Run the relevant tests for the changed code, record results, and capture any remaining manual checks.
          If unrelated failures block the full suite, document them explicitly.
  - from: "testing"
    to: "human-testing"
    actions:
      - type: "validate"
        rule: "has_test_plan"
      - type: "validate"
        rule: "section_checkboxes_checked: Testing"
      - type: "validate"
        rule: "has_comment_prefix: tests:"
      # Issues created before the date are exempt (owner, D-3 of
      # workflow/issue-cli-prove-link-each-criterion-to-its-proof).
      - type: "validate"
        rule: "criteria_proven: since 2026-10-24"
      - type: "append_section"
        title: "Human Testing"
        body: |
          - [ ] Human verification complete if required
  - from: "human-testing"
    to: "documentation"
    actions:
      - type: "require_human_approval"
        status: "documentation"
      - type: "append_section"
        title: "Documentation"
        body: |
          - [ ] User-facing docs updated if behavior changed
          - [ ] The change adds workflow.yaml config, a validator, an action or a prompt pattern other projects should adopt, or changes what an existing one does → catalog entry added, or its version: bumped to the next release so installed projects get an update proposal (`issue-cli workflow upgrade --all` lists it), or n/a
          - [ ] Docs comment added (`issue-cli comment <slug> --text "docs: ..."`)
  - from: "documentation"
    to: "shipping"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Documentation"
      - type: "validate"
        rule: "has_comment_prefix: docs:"
      - type: "append_section"
        title: "Shipping"
        body: |
          - [ ] Changes committed with a message referencing the issue
          - [ ] `cmd/issue-cli/CHANGELOG.md` entry added under `## Unreleased` (no version bump; the lead cuts releases per milestone)
          - [ ] Local `main` merged into the branch and `make validate` green after the merge
          - [ ] Local main fast-forwarded to the branch (`git -C <main checkout> merge --ff-only <branch>`; no push, no pull request)
          - [ ] Check scripts (scripts/checks/<name>.sh) removed in a last commit before the merge, or none
  - from: "shipping"
    to: "done"
    actions:
      - type: "validate"
        rule: "section_checkboxes_checked: Shipping"
  # Park from anywhere (blocked, deferred, or won't do); leave to any status.
  - from: "*"
    to: "parked"
    fields:
      - name: "parked_reason"
        prompt: "Why is it parked? (blocked on…, deferred until…, or won't do because…)"
        target: "section:Parked Record"
        type: "multiline"
        required: true

# Custom one-shot agent buttons, rendered on the issue detail view below the
# built-in Claude/Codex dispatch buttons. Each opens a tmux agent session
# briefed with the prompt below — no validation, no status change. Prompts are
# templated with {{slug}}/{{title}}/{{status}}/{{system}}/{{priority}}/{{number}}.
# (Originally named `actions:`; that key still works as a deprecated alias.)
issue_actions:
  - id: "defer-to-team"
    label: "Defer to team"
    agent: "claude"
    prompt: |
      Issue "{{title}}" ({{slug}}, status: {{status}}) is being deferred to the team.
      Draft a short, neutral handoff note that summarizes the current state, what is
      blocking progress, and the specific decision or input needed from the team.
      Then add it as a comment with: issue-cli comment {{slug}} --text "deferred: <summary>"

# Brief for the project lead (`issue-cli lead spawn`). The CLI adds a footer
# with the lead's role, authority and handoff note.
# Placeholders: {{project}} {{lead}}.
leads:
  project: |
    You are the project lead of {{project}}, running in {{lead}} in the main checkout.
    The human decides. You groom ideas, dispatch the workers the human names, check on
    them, relay their questions and approvals, review their designs and diffs, and fix the
    process from retros (retros/, swept into retros/archive/).
    - See the work: issue-cli lead list, issue-cli list, issue-cli next, and the board's Agents tab.
    - Workers own one issue each (agent-<slug>, in .worktrees/<slug>). The human dispatches them
      from the board, or names them in your chat and you dispatch exactly those.
    - Talk to a worker: SendMessage to agent-<slug>. For coordination only; decisions come from the human.
    - Lead epics yourself (one lead per project). Epic children branch from main
      and ship to main like any other issue.
    - Bring questions to the human one at a time, with the asker's recommendation and yours,
      and record each answer in the human's words:
      issue-cli decide <slug> --text "..." --how "lead chat" --quote "<their words>".
    - Check-ins: report only what changed since the last one.

# Project-level one-shot agent buttons, rendered on the list/board/graph views
# (not bound to a single issue). Prompts template with {{project}} only.
project_actions:
  - id: "triage-backlog"
    label: "Triage backlog"
    agent: "claude"
    prompt: |
      Review every issue in the {{project}} backlog. For each, assess whether the
      design is clear enough to start and whether its priority still looks right.
      Summarize a recommended order to pick up next and flag anything blocked or
      stale, then post it with: issue-cli comment <slug> --text "triage: <note>"
  - id: "ux-review"
    label: "UX review"
    agent: "claude"
    prompt: |
      Run an ease-of-use review of {{project}} as a newcomer would meet it. Change no code.
      Look through three lenses:
        - Setup: installing, configuring, and what has to be written by hand.
        - First run: how long until the user sees the tool's value (for this tool, the first human approval).
        - Daily use: what the human repeats most, and what costs them attention.
      Also check how easily an agent can set the project up and explain it, if a user asks one.

      1. Read README.md, docs/getting-started.md, the Makefile, install.sh and the bundled templates
         under cmd/issue-cli/templates/. Note every step the docs ask for.
      2. Walk that path for real in a throwaway sandbox under .agent-logs/ux-sandbox/ (gitignored):
         a fresh `git clone` of this repo, `make build build-cli`, `make demo` on a free port, and
         `issue-cli init` / `create` in an empty folder. Use `--help` on the commands you touch, and curl
         the board pages. Never touch the real projects.yaml, the issues/ tree or user state.
      3. Record each place where a step fails, needs a file written by hand, prints an unclear message,
         or assumes something the docs don't say. Cite the evidence: the command and its output, or
         file:line. Don't count anything you didn't see.
      4. Before filing anything, check what is already tracked: `issue-cli search "<keyword>"` and
         `issue-cli list`. The adoption umbrella (`issue-cli search adoption`) and its children may
         already cover a finding.
      5. Write the report to .agent-logs/ux-review-<YYYY-MM-DD>.md. List findings ranked by impact on
         newcomers, each with its lens, evidence, a proposed fix, effort (S/M/L) and the existing issue
         it belongs to, if any. Then show the human the top five in chat.
      6. Ask the human which new findings to file. For each one they pick, run
         `issue-cli create --title "..." --system <CLI|UI|API|Workflow> --priority <p>` and write the
         body from the report. When a finding belongs under the adoption umbrella, add
         `issue-cli set-meta <slug> --key parent --value <umbrella slug>`. For findings that fit an
         existing issue, add an `issue-cli comment <slug> --text "ux: <finding and evidence>"` instead.
      7. Delete .agent-logs/ux-sandbox/ and stop any board you started.

systems:
  API:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant context before proposing changes.
          Turn the problem into explicit checklists, assumptions, and open questions.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          For API changes that affect UI-visible state, state the source of truth, whether server-side polling plus `/hash` is the expected refresh path, and whether manual browser verification is required before human-testing.
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/API/ with any changed endpoints, request/response formats, or behavior.
          Reference docs/API/overview.md for the current API documentation structure.
    transitions:
      []
  CLI:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant context before proposing changes.
          Turn the problem into explicit checklists, assumptions, and open questions.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          Document the output contract early: whether text is human-facing or agent-facing, whether script compatibility matters, and whether `--json` or other machine-readable output is in scope for this issue.
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/CLI/ with any changed commands, flags, or output formats.
          Reference docs/CLI/overview.md for the current CLI documentation structure.
    transitions:
      []
  UI:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant context before proposing changes.
          Turn the problem into explicit checklists, assumptions, and open questions.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          For UI work that launches local tools or editors, state whether to reuse existing tmux/alacritty patterns, whether handlers may block on local processes, and what feedback the user sees after launch.
          Name the elements the issue's playtest session will point at; each gets a data-testid listed in internal/testids/testids.go (issue-cli process playtest web).
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          Mockups come before the written design for any change the user sees (docs/UI/overview.md, "Mockups in design"):
            1. Build them as a Claude artifact: a Design canvas with one artboard per screen, or an HTML page for a single view or a side-by-side comparison. Use real data from the project, not lorem ipsum. If the direction is unclear, ask the human what to compare before building.
            2. Link it in frontmatter: `issue-cli set-meta <slug> --key mockups --value <artifact url>`.
            3. The artifact is private, so save its sources under issues/attachments/<issue-name>/ (the .dc.html artboards or the .html page).
            4. Make screenshots with `tools/mockup-shots/shots.py issues/attachments/<issue-name>/` (Playwright; works for Design artboards and HTML pages). It captures each screen at full height and widens for boards that scroll sideways; add `--shot "<css>=<name>"` for a close-up of one region. Look at every image before using it.
            5. Under `## Mockups`, add one subsection per screen: the image (path relative to the issue file, e.g. `../attachments/<issue-name>/<screen>.png`) and a description of its layout, each region, the states and markers it shows, and what happens on interaction. Someone who cannot open the artifact must be able to build the screen from the image and the text.
          No visible change (e.g. a handler that launches a local tool): write why under `## Mockups` instead and tick its box.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/UI/ with any changed views, templates, or interaction patterns.
          Reference docs/UI/overview.md for the current UI documentation structure.
    transitions:
      - from: "idea"
        to: "in design"
        actions:
          - type: "append_section"
            title: "Mockups"
            body: |
              - [ ] Mockups published as a Claude artifact and linked in the `mockups` frontmatter field (or why none)
              - [ ] Sources saved under issues/attachments/<issue-name>/, one screenshot and description per screen below
      - from: "in design"
        to: "backlog"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Mockups"
      - from: "in design"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Mockups"
  Workflow:
    statuses:
      - name: "in design"
        prompt: |
          Review the relevant workflow and transition logic before proposing changes.
          State which statuses, rules, templates, or overlays will change, and whether existing issues need migration or compatibility handling.
          Write the design into the issue body under the relevant sections before checking the related boxes.
          Before settling the approach, list existing features that already do something similar and say why this one is still needed — or propose shrinking or dropping it.
          Describe how agents will discover and use the change. Prefer hints in CLI output and error messages over prompt text, which does not reach other projects' workflows or non-dispatched sessions.
          When the design is complete, tell the human in chat that it needs approval in the issue viewer: `backlog` to queue it, or `in progress` to start straight away. Then stop and end your turn. When the human says it is approved, run `issue-cli context <slug>` and transition to the status in `human_approval`.
      - name: "documentation"
        prompt: |
          Update docs/Workflow/ with any changed statuses, transitions, actions, or overlay behavior.
          Reference docs/Workflow/overview.md for the current workflow documentation structure.
    transitions:
      []

# Types of work (docs/Workflow/types.md): an issue's `type:` picks its path.
# Unset or unknown types get default_type, so existing issues keep the full path.
default_type: feature

types:
  feature:
    description: "New behaviour: the full path through design, testing and docs"
    # no path: every base status and edge

  tweak:
    description: "A small change the human already decided (their words in the body); no design, no new behaviour"
    path: [idea, in progress, testing, shipping, done, parked]
    statuses:
      - name: "in progress"
        prompt: |
          Tweak: build exactly what the body says the human decided, nothing more. No design doc.
          If it turns out to need new behaviour or a design decision, say in chat that the type should change to feature (in the issue viewer) and end your turn.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Implementation"
            body: |
              - [ ] Change made as decided, nothing more
              - [ ] Automated tests added or updated where practical
          - type: "append_section"
            title: "Test Plan"
            body: |
              ### Automated
              - [ ] Automated verification recorded

              ### Manual
              - [ ] Manual check listed if the change is visible (a playtest session when it shows on the board, a guided check script when it runs from a shell)
      - from: "testing"
        to: "shipping"
        actions:
          - type: "validate"
            rule: "section_checkboxes_checked: Testing"
          - type: "validate"
            rule: "has_comment_prefix: tests:"
          - type: "require_human_approval"
            status: "shipping"
          - type: "append_section"
            title: "Shipping"
            body: |
              - [ ] Changes committed with a message referencing the issue
              - [ ] `cmd/issue-cli/CHANGELOG.md` entry added under `## Unreleased` (no version bump; the lead cuts releases per milestone)
              - [ ] Local `main` merged into the branch and `make validate` green after the merge
              - [ ] Local main fast-forwarded to the branch (`git -C <main checkout> merge --ff-only <branch>`; no push, no pull request)
              - [ ] Check scripts (scripts/checks/<name>.sh) removed in a last commit before the merge, or none

  epic:
    description: "Tracking only: groups work under one goal; children carry parent: <epic slug>, their own type and version, and ship to main as usual"
    path: [idea, in progress, done, parked]
    statuses:
      - name: "idea"
        prompt: |
          Epic: nothing is built on this issue. Its body holds the goal, the plan, the decisions that bind its children (cite them as `<slug>#D-n`) and the open questions. Children are separate issues with `parent: <this slug>` and their own type and version. The lead moves it to "in progress" when its first child starts.
      - name: "in progress"
        prompt: |
          Epic: children are built and ship to main one by one; the epic owns no branch. The lead keeps the child list current, records decisions that bind the whole area here with `issue-cli decide`, and watches progress on the Status page's Epics card. It closes when every child is done or parked ("close?" on the Epics card), on the human's approval.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "body_not_empty"
      - from: "in progress"
        to: "done"
        actions:
          - type: "validate"
            rule: "children_closed"
            values: ["done", "parked"]
          - type: "require_human_approval"
            status: "done"

  bugfix:
    description: "Something that worked is broken: a repro and a failing test first, then the fix"
    path: [idea, in progress, testing, human-testing, documentation, shipping, done, parked]
    statuses:
      - name: "idea"
        prompt: |
          A bug: write a `## Repro` section with the exact steps or test, what happens, what should happen, and since when if known.
          Then say in chat that it needs `in progress` approval in the issue viewer, and end your turn; the lead (or the human) resumes you once it is approved.
      - name: "in progress"
        prompt: |
          Bugfix: first write a test that fails on the bug, then fix it. No design doc.
          If the fix changes behaviour the design decided, say in chat that the type should change to feature (in the issue viewer) and end your turn.
    transitions:
      - from: "idea"
        to: "in progress"
        actions:
          - type: "validate"
            rule: "has_section"
            section: "Repro"
            hint: "issue-cli append {{slug}} --body \"## Repro\\n<steps>, what happens, what should happen\""
          - type: "require_human_approval"
            status: "in progress"
          - type: "validate"
            rule: "has_assignee"
          - type: "append_section"
            title: "Implementation"
            body: |
              - [ ] Failing test written first
              - [ ] Fix makes it pass; no other behaviour changes
          - type: "append_section"
            title: "Test Plan"
            body: |
              ### Automated
              - [ ] Automated verification recorded

              ### Manual
              - [ ] Repro steps re-run and the bug is gone (a playtest session when it shows on the board, a guided check script when it runs from a shell)

# Where the work lives (docs/workflow.md, privacy). Work files stay in the
# private tracker; development stays in the private dev repo and the public
# repo gets one squashed commit per release.
privacy:
  work_files: tracker
  work_paths: [issues, sessions, retros, bugs, .health/snapshots]
  code: snapshots
  public_remote: public
  public_branch: main
  decided: "2026-10-24, owner in lead chat (the decisions and their words are in the private tracker)"
